base_config:
- egs/tts/config_base.yaml
- egs/asr/datasets/asr_dataset_v2_251219.yaml

# task
task_cls: tasks.asr.causal_asr_v2_task.CausalASRTask

# data
frames_multiple: 2
train_sets:
dataset_cls: tasks.asr.dataset_utils.asr_fastdataset_v2.ASRShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork

# dataloader
eval_max_batches: 0
ds_workers: 4
max_tokens: 12000
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_max: 6000  # 60 sec
tgt_size_min: 400   # 4 sec

# model
backbone: llama_seq2seq
model_size: small
audio_encoder_type: wavlm
audio_encoder_ckpt: checkpoints/wavlm/WavLM-Large.pt

# noise
wav_add_noise: False
wav_add_effect: False
musan_dir: /mnt/bn/sa-ag-data/liruiqi/data/speech/musan
musan_with_speech: False
wav_add_noise_prob: 0.1
wav_add_effect_prob: 0.1

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5
print_text_prob: 0.001
grad_norm_skip_threshold: 1000000
