base_config: ./base.yaml
task_cls: tasks.vocoder.hifigan.HifiGanTask
resblock: "1"
upsample_rates: [ 6,5,4,2 ]
upsample_kernel_sizes: [ 12,11,8,4 ]
upsample_initial_channel: 512
resblock_kernel_sizes: [ 3,7,11 ]
resblock_dilation_sizes: [ [ 1,3,5 ], [ 1,3,5 ], [ 1,3,5 ] ]

use_pitch_embed: false
use_fm_loss: false
use_ms_stft: true
use_cond_disc: false
avg_disc_loss: true
use_univnet_disc: false
nsf_type: cycle

use_subband_stft_loss: false
subband_stft_loss_params:
  fft_sizes: [ 384, 683, 171 ]  # List of FFT size for STFT-based loss.
  hop_sizes: [ 30, 60, 10 ]     # List of hop size for STFT-based loss
  win_lengths: [ 150, 300, 60 ] # List of window length for STFT-based loss.
  window: "hann_window"       # Window function for STFT-based loss

mpd:
  periods: [ 2,3,5,7,11 ]
  kernel_size: 5
  stride: 3
  use_spectral_norm: False
  lReLU_slope: 0.2
# univnet disc
use_mrd: true
mrd:
  resolutions: [ [ 1024, 120, 600 ], [ 2048, 240, 1200 ], [ 512, 50, 240 ] ] # (filter_length, hop_length, win_length)
  use_spectral_norm: False
  lReLU_slope: 0.2
lambda_mel: 5.0
lambda_cdisc: 4.0
lambda_adv: 2.0
lambda_mrd: 1.0
lambda_msd: 1.0
lambda_mpd: 1.0

adam_b1: 0.8
adam_b2: 0.99
lr: 0.0001
disc_lr: 0.0001

generator_scheduler_params:
  step_size: 1000
  gamma: 0.999
discriminator_scheduler_params:
  step_size: 1000
  gamma: 0.999
max_updates: 6000000
