base_config:
  - egs/vae/wavvae_v9.yaml

dataset_cls: tasks.tts.dataset_utils.vae_fastdataset_v2.VAEFixedLenProcessMixShmDataset
task_cls: tasks.vae.wavvae_v10_task.WavVAETask

fft_size: 2400
hop_size: 480
win_size: 2400
audio_sample_rate: 48000
f0_max: 600
f0_min: 60
fmax: 24000
fmin: 0
loud_norm: false
audio_num_mel_bins: 320
mel_vmax: 0.5
mel_vmin: -6

ds_workers: 16
tgt_size_min: 400
tgt_size_max: 400
frames_multiple: 4
vae_stride: 4
max_tokens: 800   # mel frames
wav_mix_prob: 0.2

reinit_modules_after_load: []
reinit_encoder_after_load: false
reinit_bottleneck_after_load: false
reinit_decoder_after_load: false
reinit_latent_upsample_after_load: false

# model
model_version: v10
kernel_size: 7
encoder_kernel_sizes: [7, 7, 7, 7, 7, 7]
encoder_dim: 96
encoder_rates: [2, 3, 5, 4, 4, 4]
encoder_dilations: [[1, 3, 9], [1, 3, 9], [1, 3, 9], [1, 3, 9], [1, 3, 9], [1, 3, 9]]
transformer_n_layers: 2
transformer_n_head: 16
transformer_n_kv_heads: 8
transformer_use_sliding_window: True
transformer_sliding_window_size: 8
encoder_smoothing_layers: 1
encoder_smoothing_kernel_size: 5
encoder_smoothing_expansion: 2
latent_dim: 64
decoder_dim: 1920
decoder_rates: [5, 4, 4, 4, 3, 2]

lr: 1.0e-4
disc_lr: 2.0e-4
warmup_updates: 5000
disc_start_steps: 50000
disc_warmup_steps: 3000
kl_start_steps: 0
kl_annealing_step: 60000

accumulate_grad_batches: 1
grad_norm_skip_threshold: 5000000.0
grad_norm_skip_init_threshold: 500000.0
freeze_decoder: False
distill_max_steps: 0
low_sample_rate_enhance_prob: 0.01
low_sample_rate: [8000, 11025, 16000, 22050, 24000, 32000, 44100]
gradient_checkpointing: False
cudnn_benchmark: True
rope_random_position_offset: True
rope_random_position_offset_max_sec: 240.0

lambda_kl: 0.01
lambda_adv: 1.0
lambda_mel: 10.0
lambda_stft: 6.0
lambda_fm: 2.0
lambda_energy: 0.0

lambda_mpd: 1.0
lambda_mrd: 1.0
lambda_msd: 0.0
lambda_distill: 0.0

lambda_interp_mid: 0.0
interp_pair_topk: 4
interp_pair_temperature: 0.2
interp_pair_escape_prob: 0.1
interp_pair_mel_bins: 80

latent_sphere_reg_weight: 1.0e-5
latent_sphere_reg_mean_weight: 0.0
latent_sphere_reg_var_weight: 0.0
latent_sphere_reg_cov_weight: 1.0
latent_sphere_reg_target_var: 1.0
latent_sphere_reg_max_frames: 8192

latent_logdet_reg_weight: 0.0
latent_logdet_eps: 1.0e-4
latent_logdet_max_frames: 8192

latent_small_eig_reg_weight: 0.0
latent_small_eig_floor: 0.1
latent_small_eig_eps: 1.0e-4
latent_small_eig_max_frames: 8192
latent_small_eig_active_only_avg: false

latent_min_std_reg_weight: 1.0e-2
latent_min_std_floor: 0.1
latent_min_std_eps: 1.0e-6
latent_min_std_max_frames: 8192

lambda_latent_tail: 1.0e-5
latent_tail_elem_weight: 1.0
latent_tail_frame_weight: 0.0
latent_tail_elem_threshold: 6.0
latent_tail_frame_threshold: 96.0
latent_tail_max_frames: 8192

latent_geometry_monitor: true
latent_geometry_monitor_step: 1
latent_geometry_monitor_eps: 1.0e-4
latent_geometry_monitor_max_frames: 8192

load_ckpt_disc: 
do_load_ckpt_disc: false

use_mr_mel: True
mr_mel:
  fft_size: [32, 64, 128, 256, 512, 1024, 2048, 4096]
  audio_num_mel_bins: [5, 10, 20, 40, 80, 160, 320, 640]
  hop_size: [8, 16, 32, 64, 128, 256, 512, 1024]
  win_size: [32, 64, 128, 256, 512, 1024, 2048, 4096]
  fmin: [0, 0, 0, 0, 0, 0, 0, 0]
  fmax: [24000, 24000, 24000, 24000, 24000, 24000, 24000, 24000]
mel_band_edges_hz: [0.0, 3000.0, 8000.0, 12000.0, 24000.0]
mel_band_weights: [1.0, 1.0, 1.0, 1.0]

stft_loss_params:
  resolutions:
    - [256, 32, 128]
    - [512, 64, 256]
    - [1024, 120, 600]
    - [2048, 240, 1200]

lambda_transient_stft: 0.5
transient_stft_use_log_mag: true
transient_stft_positive_only: true
transient_stft_onset_weight: 0.5
transient_stft_loss_type: l1
transient_stft_eps: 1.0e-7
transient_stft_params: {}

mpd:
  kernel_size: 7
  lReLU_slope: 0.2
  periods:
  - 2
  - 3
  - 5
  - 7
  - 11
  stride: 3
  use_spectral_norm: false
use_mrd: true
mrd:
  lReLU_slope: 0.2
  resolutions:
  - [256, 24, 96]
  - [512, 50, 240]
  - [1024, 120, 600]
  - [2048, 240, 1200]
  use_spectral_norm: false
use_msd: false
use_cond_disc: false
use_ms_stft: true
adam_b1: 0.8
adam_b2: 0.95
avg_disc_loss: True
