base_config:
  - egs/tts/config_base.yaml

dataset_cls: tasks.tts.dataset_utils.vae_fastdataset_v2.VAEShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork

# dataloader
ds_workers: 6 
max_sentences: 100
tgt_size_min: 50
tgt_size_max: 500   # mel frames
frames_multiple: 4
vae_stride: 4
dynamic_batch: True
max_tokens: 3000   # mel frames
fast_ds_prefetch_steps: 64
# fast_ds_shuffle_buffer: 4
wav_mix_prob: 0.1
wav_mix_alpha_range: [0.4, 0.6]
wav_add_effect: True
wav_add_effect_prob: 0.1
batch_saver_mult: 2

# optimizer
optimizer:
  betas:
  - 0.9
  - 0.999
  fused: false
  lr: 7.5e-5
  weight_decay: 0.00
lr: 5.0e-5
mixed_precision: bf16
clip_grad_norm: 0.0
generator_grad_norm: 1.0
discriminator_grad_norm: 1.0
disc_start_steps: 50000

# task
task_cls: tasks.vae.wavvae_v9_task.WavVAETask
use_fsdp: false
load_ckpt: ''
use_ema: false
val_check_interval: 2000
eval_max_batches: 0
val_batch_size: 0
fast_ds_shuffle_buffer: 128
ckpt_milestone_interval: 10000
cudnn_benchmark: False

# model
is_vocoder: False
kernel_size: 7
encoder_dim: 24
encoder_rates: [2, 3, 4, 5, 8]
transformer_n_layers: 6
transformer_n_head: 12
transformer_n_kv_heads: 6
transformer_use_sliding_window: True
transformer_sliding_window_size: 16
latent_dim: 32
latent_upsample: 4
decoder_input_dim: 32
decoder_dim: 2048
decoder_rates: [5, 4, 3, 2, 2]

kl_start_steps: 0
kl_annealing_step: 1000
warmup_updates: 10000
accumulate_grad_batches: 4
grad_norm_skip_threshold: 50000.0
grad_norm_skip_init_threshold: 50000.0
freeze_decoder: False
distill_max_steps: 0
gradient_checkpointing: False
cudnn_benchmark: False

lambda_kl: 0.001
lambda_adv: 2.0
lambda_cdisc: 4.0
lambda_mel: 5.0
lambda_wav: 5.0
lambda_stft: 1.0
lambda_mpd: 1.0
lambda_mpd_fm: 0.0
lambda_mrd: 1.0
lambda_mrd_fm: 0.0
lambda_msd: 1.0
lambda_msd_fm: 0.0
lambda_distill: 1.0
lambda_energy: 0.0

load_ckpt_disc: checkpoints/1117_melgan-nsf_full_1

use_mr_mel: false
mr_mel:
  fft_size: [32, 64, 128, 256, 512, 1024, 2048]
  audio_num_mel_bins: [5, 10, 20, 40, 80, 160, 320]
  hop_size: [8, 16, 32, 64, 128, 256, 512]
  win_size: [32, 64, 128, 256, 512, 1024, 2048]
  fmin: [0, 0, 0, 0, 0, 0, 0]
  fmax: [12000, 12000, 12000, 12000, 12000, 12000, 12000]
mel_band_edges_hz: []
mel_band_weights: []

mpd:
  kernel_size: 5
  lReLU_slope: 0.2
  periods:
  - 2
  - 3
  - 5
  - 7
  - 11
  stride: 3
  use_spectral_norm: false
mrd:
  lReLU_slope: 0.2
  resolutions:
  - - 1024
    - 120
    - 600
  - - 2048
    - 240
    - 1200
  - - 512
    - 50
    - 240
  use_spectral_norm: false
use_cond_disc: false
use_mrd: true
use_ms_stft: true
adam_b1: 0.8
adam_b2: 0.99
avg_disc_loss: True
