    # - caption: "<SPK>Subject1: A woman with long blond hair standing in a domestic living room, wearing a colorful printed blouse and a necklace, in front of a wooden cabinet with a flat-screen TV on top under soft, warm lighting.</SPK> The overall environment sound is the clear speech of a woman. She starts speaking, gesturing with her arms bent at the waist, her palms facing her chest. She then stretches her arms outward and raises them up and down in an irregular manner, saying <S1>Oh, no. No, you know what? He's not into that stuff anymore.</S1> She continues, saying <S1>He quit for me.</S1> while lowering her arms and imitating holding a tennis ball in both hands. She then turns slightly to the right and looks, and finally she lowers her arms naturally and turns her head to look to the left side of the screen, adding <S1>Mm-hmm.</S1> The posture changes subtly, indicating a shift from explanation to relaxation."
    # - caption: "<SPK>Subject1: A woman with long blond hair standing in a domestic living room, wearing a colorful printed blouse and a necklace, in front of a wooden cabinet with a flat-screen TV on top under soft, warm lighting.</SPK> The overall environment sound is the clear speech of a woman. She starts speaking, gesturing with her arms bent at the waist, her palms facing her chest. She then stretches her arms outward and raises them up and down in an irregular manner, saying <S1>哦，不。不，你知道的？他不再喜欢那类东西了。</S1> She continues, saying <S1>他为了我辞职了。</S1> while lowering her arms and imitating holding a tennis ball in both hands. She then turns slightly to the right and looks, and finally she lowers her arms naturally and turns her head to look to the left side of the screen, adding <S1>嗯嗯。</S1> The posture changes subtly, indicating a shift from explanation to relaxation."
