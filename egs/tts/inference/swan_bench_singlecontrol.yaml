    - caption: "Environment: { 环境为明亮室内公共空间带有轻微远处的环境音，同时人声保持清晰居中 } <BGM>BGM: { 无 }.</BGM> Speaker: { Speaker1: 年轻东亚男性留着黑色短发，戴金属框眼镜处于固定机位的中景镜头中，位于现代大堂，面向镜头。他穿着合身深色西装，内搭浅蓝色衬衫，不系领带。他的翻领上夹着一个黑色小领夹麦；自信的信息讲述式声音，坚定但有亲和力，节奏稳定 }. Content: { Speaker1边说边用手指向重点：<S1><|sp|>如果你想更系统地学习理财知识，其实可以先从建立一个简单的收入与支出表开始。<|sp|></S1> }."
