  case12.25: 
    - caption: "<SPK>Subject1: A young East Asian man with short black hair faces the camera in a fixed indoor medium shot. He wears a dark suit jacket over a light blue vertically pinstriped shirt. A black square lavalier microphone is clipped to Subject1’s left lapel. The background is pure black.</SPK> The environment is a quiet studio with no noticeable background noise. Subject1 speaks in a financial futures sales-ad voice: reliable and professional, energetic and confident, with moderate pace, clear articulation, strong intonation. Subject1 starts with both hands overlapped in front of the body, then lifts them to chest height with palms facing each other to explain and emphasize points. Blue star-like sparkle visual effects appear on screen. Subject1 raises the left hand to gesture, then lifts both hands and performs a clapping motion. Two oval cartoon graphics move from left to right and stop. Subject1 returns to both hands overlapped in front. Subject1 then raises the left hand and then the right hand to gesture in sequence, and finally places both hands back in front again, saying <S1>交易的机会。</S1> Subject1 continues speaking while gesturing, saying <S1>更不要说方向做反时，</S1> Subject1 continues speaking while gesturing, saying <S1>亏损加上手续费，让你有多心疼了。</S1> Subject1 continues speaking while gesturing, saying <S1>所以选一家费率优惠的期货公司尤为重要。</S1> Subject1 finishes speaking as the company logo and name appear on screen, saying <S1>中信建投期货。</S1>"
    - caption: "<SPK>Subject1: A young Asian woman is filmed in a fixed medium-close shot inside a restaurant, facing the camera while promoting an app. Subject1 has long dark hair, a slightly long face, delicate features, and fair skin. She wears a deep pink top with a simple neckline. The background shows a restaurant setting with wooden tables and chairs, ceiling grid decor, warm yellow lantern-style lights, and a red wall in the distance.</SPK> The environment includes soft indoor restaurant ambience under gentle lighting. Subject1 speaks in a loan-app promotion voice that feels friendly, sincere, and down-to-earth. Her delivery is brisk and lively, with expressive intonation. Subject1 holds a smartphone in the left hand and shows the calculator screen to the camera, then lowers the phone. Subject1 raises the phone again to show the back of the phone, then lowers it and continues speaking. Subject1 lifts the phone again to show the back once more, then lowers it and keeps talking. Subject1 raises the phone again to briefly show the back, then flips it to show an app interface to the camera, saying <S1>这利息够低了吧？你们要吗？我告诉大家，这些呀我都不要。这些都太贵了。我用的是拍拍贷。万元日息啊最低五毛五。换算下来借一万一年的利息呢最低是一百九十七元。真的，很划算。我都借了三四次了。我现在手机里还存着十八万呢。</S1>"
    - caption: "<SPK>Subject1: A young East Asian man stands in a bright modern building lobby in a fixed medium shot, facing the camera. Subject1 wears thin-framed glasses and a fitted dark gray suit with a beige long-sleeve shirt and a dark blue tie. A small black lavalier microphone is clipped to the suit lapel, and a white pocket square is visible. Subject1 wears a metal-band wristwatch and a brown belt. The background is a spacious, tidy lobby with blurred glass railings and ceiling lights.</SPK> The environment is a bright indoor public space, but the audio is dominated by clear, front-and-center speech. Subject1 speaks in an AI stock-diagnosis tool promotion voice that is confident, professional, and persuasive. His pace is steady but slightly fast, with crisp diction, emphatic phrasing. Subject1 keeps the left hand in the trouser pocket while the right hand periodically rises to gesture. Toward the end, Subject1 opens both hands while speaking, saying <S1>好多人都不信，还说我吹牛，结果现在又跑来问我用的是哪款 AI 工具，那我就再说一次，就是下方这个 AI 智能诊股器，不用下载安装的，直接点击就能诊股，而且它现在针对不同的散户进行了升级，只需要输入股票代码，大数据智能分析，最快三秒出诊股报告，直接发送到你手机上，智能提示。</S1>"
    - caption: "<SPK>Subject1: A young East Asian woman records a fixed close-up selfie outdoors in front of a bank entrance. Subject1 has short dark brown hair, round-frame glasses, and deep red lipstick. She wears a red V-neck top. Behind Subject1 are the bank’s exterior signage, a 24-hour self-service indicator, and glass walls with posters and promotional materials.</SPK> The environment has mild outdoor street ambience, but Subject1’s voice is captured clearly and prominently. Subject1 speaks in a free-insurance promotion voice that is lively, friendly, and engaging. Her pace is light and quick, with animated intonation. Subject1 looks into the camera and speaks. She raises the right index finger, lowers it, and continues speaking. She raises the right index finger again to point downward, then opens the right palm to gesture, saying <S1>要注意了。现在呢有一个不要钱的赔付限额两百万的保险，可以免费领了。零元领取的入口呢，就在视频下方。刷到视频的人呢，可以跟着我一起点开试一下。</S1>"
    - caption: "<SPK>Subject1: An East Asian man stands in a bright hospital lobby in a fixed close-up shot, facing the camera with a serious expression. Subject1 has a higher hairline and wears gold-rim round glasses. He wears a green sweater over a white shirt with the collar visible. The background shows large floor-to-ceiling windows with metal framing, light tile flooring, and several people moving or queueing behind him.</SPK> The environment is a spacious indoor public hall with faint background activity, while Subject1’s speech remains clear and forward. Subject1 speaks in a critical-illness insurance promotion voice that is steady, professional, and trustworthy. His delivery is measured and firm, with deliberate emphasis and natural. Subject1 gestures with the right hand: he forms a thumb-and-index gesture, then points the right index finger toward the camera, then makes a fist, and then returns to an index-finger gesture as he continues, saying <S1>责任内都是不限次数的赔付的。二十年累计八百万的一个保障额度,可以放心用,甚至是 一百二十种的重大疾病。</S1>"
    - caption: "<SPK>Subject1: A smiling middle-aged East Asian man stands indoors behind a table piled with Apple products in a fixed medium shot, facing the camera. Subject1 has short gray-white hair, a round face, and a broad grin showing teeth. He wears a black-and-white plaid jacket over a light blue T-shirt. In front of him are multiple smartwatch boxes with different band colors, stacks of tablet boxes with some tablets on top, and a tall stack of phone boxes on the left. Behind him is a light wood-pattern wall with a lit geometric black wall decoration, and a glass display cabinet with bottles and small ornaments.</SPK> The environment is an indoor room with subtle room tone, while Subject1’s voice is loud, clear, and dominant. Subject1 speaks in an energetic livestream sales voice: enthusiastic, bold, and highly contagious. He talks fast with strong rhythm, punchy emphasis. Subject1 extends the left hand, points downward with the left index finger, waves the left hand, makes a fist with the right hand, and finally opens both hands, saying <S1>这些都打包好放评论区置顶链接里了，</S1> Subject1 continues and makes a grabbing motion, saying <S1>填个收货的地址就有机会抢到，</S1> Subject1 continues with a determined fist gesture, saying <S1>先到先得，</S1> Subject1 continues and gestures with both hands as if something will disappear, saying <S1>抢完这个链接就直接下线了</S1>"
    - caption: "<SPK>Subject1: A middle-aged East Asian man sits at a tea table in a modern office in a fixed medium shot, speaking earnestly toward the camera. Subject1 has neatly styled short black hair and fair skin. He wears a khaki/light-brown double-breasted suit jacket with a white shirt and a patterned tie in brown, gold, and red tones. Subject1 holds a small black teacup with a white rim in the right hand throughout. On the table are a refined black tea set and a realistic green-and-cream cabbage-shaped ornament. The background includes a bookshelf filled with books and a glass partition wall under modern ceiling spotlights.</SPK> The environment is a quiet indoor office with soft room tone. Subject1 speaks in a platform-sharing ad voice that feels steady, approachable, and grounded, while still sounding knowledgeable and persuasive. His pace is calm, with clear articulation, expressive intonation, and natural. Subject1 keeps holding the teacup as he talks, saying <S1>以后你们凡是在网上买东西的，今天教你们一个好方法，不管买什么，下单之前多做这么一步，直接便宜了一大半，就是这个淘宝。你在这里买东西啊，买啥都便宜。</S1>"
    - caption: "<SPK>Subject1: A young East Asian woman appears in a fixed indoor medium shot, facing the camera as if livestreaming. Subject1 has shoulder-length brown hair and polished makeup. She wears a light blue sleeveless buttoned top trimmed with white lace and white pants. She wears hoop earrings, a red string bracelet on the left wrist, and pearl/other bracelets on the right wrist. The background is a light blue wall with white trim, a tall green plant on Subject1’s right, and a beige sofa on Subject1’s left.</SPK> The environment is a quiet indoor room with minimal background noise. Subject1 speaks in a lively livestream sales voice that is sweet, upbeat, and highly engaging. Her pacing is brisk, with expressive rises and falls. Subject1 starts with both hands clasped in front, then opens both palms upward in a presenting gesture, then clasps both hands again. She points downward once with the right hand and returns to the clasped pose. Yellow starburst sparkle visual effects appear on screen at times. Subject1 says <S1>不比在其他地方买划算的多。</S1> Subject1 continues speaking directly to the camera while gesturing persuasively toward the bottom of the frame, saying <S1>活动时间有限,想要的家人们抓紧时间,点击下方链接直接抢购吧。</S1> Subject1 smiles and nods while continuing to gesture toward the bottom, saying <S1>排量好货等你来抢。</S1>"
    - caption: "<SPK>Subject1: An older East Asian man sits on a wooden chair in a fixed indoor medium shot, facing the camera with a gentle expression. Subject1 has short gray-white hair and wears glasses. He wears a white long-sleeve shirt, a purple tie with white dots, and a black lavalier microphone clipped to the tie. The background is a dark green curtain, with a lit floor lamp and a green plant on the left, and a light-colored bookshelf with books and a small desk calendar on the right.</SPK> The environment is a calm indoor setting with soft room tone. Subject1 speaks in a medicine promotion voice that feels warm, credible, and approachable. His pacing is unhurried, with clear emphasis, smooth rhythm. Subject1 opens both hands upward, then brings both hands together and rests them on the legs. He raises the right hand to wave, then points forward with the right index finger, saying <S1>为什么这里比外面的便宜那么多呢？其实正品的奥利司他这么多年来一直没有涨价，都是你买贵了，都是中间商胡乱加价。</S1>"
    - caption: "<SPK>Subject1: A young Asian man stands outdoors in a fixed close-up shot, facing the camera against a dense green plant wall. Subject1 has short black hair, silver rectangular glasses, thick eyebrows, small bright eyes, and rosy lips. He wears a purple crew-neck T-shirt with embroidered cartoon dog graphics on the chest.</SPK> The environment is outdoors with faint ambient noise, while Subject1’s voice remains clear and prominent. Subject1 speaks in a promotion voice that is excited, hyped, and persuasive, with a fast pace, strong emphasis. Subject1 looks into the lens and speaks animatedly, saying <S1>正在刷视频的家人们，有个好消息，千万别错过了。官方下场，直接有机会承包你山姆超市会员年卡。这是真的可以有啊。还是六百八十的卓越版。这是为了抢占流量赚口碑的。有这好事还不抓紧下手啊。生活质量那直接上一个档次。一张卡就能够供应全家。</S1>"

