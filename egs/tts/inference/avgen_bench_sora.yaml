  #   - caption: "<SPK>Subject1: A middle-aged professional East Asian woman aged 35 to 45 with short dark hair and thin-framed glasses speaks as a domain expert. She wears a white shirt with tailored dark trousers and holds a single-dose hair dye cream product while explaining.</SPK> The audio is clean and studio-like, with a persuasive yet friendly expert tone: clear articulation, confident emphasis, and a brisk, problem-solution cadence. Over a split-screen demo showing scalp staining vs a clean scalp, Subject1 delivers a pain-point hook, then appears on-camera holding the product and gesturing with the free hand to recommend it, saying <S1>盖白发总染到头皮？染后发质变差像枯草？别急，今天给姐妹们推荐一款真正不伤发的染发神器！</S1>"
  #   - caption: "<SPK>Subject1: A middle-aged calm, authoritative East Asian woman aged 35 to 45 narrates as a domain expert. She is implied to be in professional attire, delivering guidance with an instructional and reassuring presence.</SPK> The environment is quiet, and the narration is front-and-center with energetic, easy-to-follow emphasis. While close-up hands press a pump to dispense creamy dye and apply it directly onto hair like conditioner, then a comparison shows messy multi-bottle mixing versus single-dose use, Subject1 speaks in a fast, practical “how-to” style, saying <S1>它最牛的是免调配单剂设计！挤出来直接抹，像涂护发素一样简单，新手也能五分钟搞定全头，再也不用手忙脚乱调比例啦！</S1>"
