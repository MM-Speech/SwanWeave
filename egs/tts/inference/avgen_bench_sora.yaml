  # - caption: "<SPK>Subject1: A young East Asian woman with long straight dark hair faces the camera in a fixed indoor medium shot. She wears a white long-sleeved V-neck blouse with a pearl round brooch, and a black lavalier microphone clipped on the collar.</SPK> The background is a softly blurred office interior with a dark wavy bookshelf; a mild beautifying filter is applied to Subject1’s face, and the bookshelf shows slight geometric warping. The audio is clean and front-and-center. Subject1 speaks in a securities account-opening benefits ad voice: clear, professional, friendly, and engaging, with a moderate-to-slightly-fast pace, rich intonation, and varied natural pauses. Subject1 looks directly into the lens and speaks while keeping both hands clasped in front of the chest; she briefly loosens the clasp and then clasps again. Near the end, Subject1 raises both hands and holds up both index fingers for emphasis, saying <S1>新客开户</S1> Subject1 continues speaking with small hand motions while maintaining eye contact, saying <S1>即享新客专属“VIP”优惠拥金，有机会让你降低交易成本。</S1> Subject1 continues with a bright, confident expression, saying <S1>另外新客开户还有价值约一千六百八十八元的新客福利可以领取。</S1> Subject1 continues clearly, hands returning to a clasped position in front, saying <S1>限时免费体验沪深 level 二十档行情，助你把握投资时机。</S1> Subject1 concludes with emphatic phrasing, saying <S1>另外还有专业投顾一对一陪伴式服务</S1>"
  # - caption: "<SPK>Subject1: A young East Asian man with short black hair and clear-framed glasses faces the camera in a fixed indoor medium-close shot. He wears a white short-sleeved striped shirt with a black lavalier microphone clipped near the collar.</SPK> Behind Subject1 is a large window showing a modern city view with high-rises and a wide road. The audio is clear and prominent. Subject1 speaks in a short-term stock trading livestream promo voice: steady and professional yet passionate and rallying, with a slightly fast pace, crisp articulation, strong intonation, and varied pauses. Subject1 starts with both hands clasped in front, briefly lifts the right hand to gesture, then clasps both hands again, saying <S1>玩短线的，来我直播间，每天一只票，今天买明天卖。只有一千块钱的本金，反复操作，快进快出，积累投资经验。如果说你还找不对方向，赶紧来到直播间，我现场演示给你看。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian woman faces the camera in a fixed indoor medium shot. She has long straight dark-brown hair with a small section held by a metallic hair clip, and wears a casual light-colored T-shirt and simple jewelry.</SPK> The background is a pair of hanging curtains in two contrasting colors. The audio is clean with minimal background noise. Subject1 speaks in an emotional insurance-promotion voice: gentle and sincere with a reflective tone, a slower pace, natural breath and pauses, and restrained but expressive intonation. Subject1 maintains eye contact and speaks steadily, saying <S1>升级了，保障更全，医保内外的都能保。而且现在升级了，一些进口药甚至是百分百报销，而且还能住进三甲的特需病房。而且可以续保终身，很适合长期治疗的病。现在的我呢，也因为一场病，这里破碎，也让我们八年的婚姻走上了结。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian man is filmed in a fixed indoor medium shot, seated at a white desk and facing the camera. Subject1 wears black-framed glasses and a black polo shirt with a small round lavalier microphone clipped on the chest. A smartphone sits on a metal stand on the right side of the desk, and a simple cartoon sky backdrop fills the background.</SPK> The environment is quiet with clean, close-mic speech. Subject1 speaks in an insurance enrollment promotion voice that feels friendly, professional, sincere, and persuasive, with moderate pace, clear articulation, rich and natural pauses, and varied intonation. Subject1 raises the right hand to gesture, then interlaces both hands on the desk. A yellow check-mark graphic appears on the right side of the frame. Subject1 releases the hands and gestures with both hands raised, then interlaces both hands again. Subject1 raises the right hand to gesture, then opens both palms upward to explain, lowers the left hand, and waves with the right hand. Subject1 ends by interlacing both hands once more, then opens both palms upward again, saying <S1>即使你已经有体检异常了，也是能申请投保的。</S1> Subject1 continues speaking while gesturing, saying <S1>等待期过后，复发了，严重了，还能去申请理赔。你要是还不知道，那去医院看病住院就比别人白白多花了一笔钱。现在呢不管你是有</S1>"
  # - caption: "<SPK>Subject1: A young Asian woman is filmed in a fixed indoor close shot, holding a phone in the left hand as if reading a message, then looking up to address the camera. Subject1 wears a light turtleneck under a pink cardigan.</SPK> The room is softly lit with minimal background noise. Subject1 speaks in an insurance product promotion voice that is gentle, reassuring, and confident, with moderate pace, clear phrasing, and natural pauses. Subject1 reads from the phone, lifts the gaze to the camera to continue, then points toward the lens with the right index finger for emphasis and repeats the pointing gesture while explaining, saying <S1>现在已经得了癌症了，还能投保保险吗？当然可以了啊。你可以看看这款众安全民普惠保 PLUS 。不用体检，不需要健康告知，只要你有社保，带着任何疾病都能够投保。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian woman is filmed in a fixed office close shot, facing the camera. Subject1 wears thin-frame glasses, a sleeveless dark top, a pearl necklace, and a small wireless microphone clipped on the chest.</SPK> The office is quiet and the speech is captured clearly. Subject1 speaks in a securities market livestream promotion voice that is professional, composed, and commanding, slightly fast with crisp diction, strong emphasis, and varied pauses. Subject1 talks directly to the camera, lifts the right arm and raises the right hand beside the face to make a point, then lowers the hand and continues, saying <S1>明天开盘的走势可能出乎</S1> Subject1 continues speaking with a steady, serious tone, saying <S1>你们所有人意料，</S1> Subject1 continues, warning viewers, saying <S1>如果明早出现大波动</S1> Subject1 continues with firm emphasis, saying <S1>千万要管住手，不要乱操作。</S1> Subject1 continues, sounding urgent, saying <S1>我紧急加播一场</S1> Subject1 continues, explaining the plan, saying <S1>给你把明天的走势</S1> Subject1 continues, keeping the tone direct and efficient, saying <S1>聊清楚。就播十分钟啊！</S1> Subject1 continues, urging immediate attention, saying <S1>还不知道发生什么的，赶紧</S1>"
  # - caption: "<SPK>Subject1: A middle-aged East Asian woman is filmed in a fixed medium shot inside a car, facing the camera and holding a small red item in both hands.</SPK> The in-car ambience is faint, while Subject1’s voice is front-and-center. Subject1 speaks in a loan product promotion voice that feels steady, trustworthy, and persuasive, with moderate pace, clear articulation, and expressive intonation. Subject1 holds the red item while speaking, points toward the camera with the right index finger, retracts the hand, then gestures with the right hand. Subject1 briefly pushes a right-hand fist forward for emphasis, then brings the red item up and holds it closer to the chest with both hands, saying <S1>就可以在线申请</S1> Subject1 continues speaking, saying <S1>它最快是十分钟到账。</S1> Subject1 continues, reassuring the viewer, saying <S1>急用钱的时候一点也不会耽误我的事。</S1> Subject1 continues, calling for action, saying <S1>如果说你现在着急用钱啊，赶快点击视频下方链接，</S1> Subject1 finishes with a clear directive, saying <S1>去申请一下你的额度吧。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian woman is filmed in a fixed indoor medium-close shot, facing the camera as if speaking in a public indoor space.</SPK> The environment has light indoor background noise, but Subject1’s speech remains clear. Subject1 speaks in an insurance promotion voice that is warm, down-to-earth, and convincing, slightly fast with lively intonation and natural pauses. Subject1 maintains eye contact with the camera and speaks continuously to explain eligibility and benefits, saying <S1>正在治疗中也是可以买的。每个月只需要十九块钱，就能享受赔付总限额六百万的医疗保障。有癌症肿瘤、三高、糖尿病等等疾病，都是可以带病申请投保的。没错啊，就是直播间这款众安全民普惠保，不需要任何的健康告知，也不需要任何的体检报告。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian man is filmed in a fixed medium-close shot in a kitchen, facing the camera in a chef uniform and glasses.</SPK> The kitchen ambience is subtle, while Subject1’s voice is clear and close. Subject1 speaks in an insurance claim-case promotion voice that is plainspoken and sincere, carrying a hint of fear and relief, with moderate pace, noticeable pauses, and expressive emphasis. Subject1 lifts the right hand with the palm facing forward and gives a brief wave-like motion, then raises the right hand to form a “V” sign, then opens the right palm and sways it side to side while continuing, saying <S1>能给我理赔。哎呀我现在想起来都后怕，要是没这份保险，这八万块钱就得我自己掏。小本生意哪经得起这种折腾。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian man is filmed in a fixed medium shot, facing the camera with a small lavalier microphone clipped near the collar. Several monitors behind Subject1 display dense stock charts and market data.</SPK> The room is quiet and the speech is recorded clearly. Subject1 speaks in a securities investment livestream promotion voice that is energetic, professional, and highly persuasive, with slightly fast pace, strong rhythm, emphatic rises and falls, and natural pauses. Subject1 speaks straight to the lens as if coaching viewers on rapid trading practice and inviting them to join the livestream, saying <S1>每天一只票，今天买，明天卖。只有一千块钱本金，反复操作，快进快出，积累投资经验。如果说你还找不对方向，赶紧来我直播间，交流学习。</S1>"
  # - caption: "<SPK>Subject1: A young East Asian woman is filmed in a fixed close shot indoors, facing the camera while wearing a wedding dress and veil.</SPK> The environment is quiet with clear, intimate speech. Subject1 speaks in an urgent securities livestream promotion voice that is excited, pressing, and rallying, with fast pace, sharp emphasis, dramatic intonation swings, and frequent, natural pauses. Subject1 starts with both hands near the chest, then gestures with both hands while speaking, occasionally closing the eyes mid-sentence as if stressing urgency, saying <S1>朋友们，明天开盘你就盯它啊。我不知道大家新闻看了没有，那边传来一个惊天大消息。我真的，我今天，今天连席的饭我都一口都没吃，我说抓紧赶回去给大家加播一场。如果说你看到我今天开播了，你就抓紧时间进来。我直接讲重点。</S1>"
  # - caption: "<SPK>subject1: A young East Asian woman sits on a sofa in a fixed indoor medium shot, facing the camera. She wears a brown spaghetti-strap dress.</SPK> The environment is quiet with clean, front-and-center speech. subject1 speaks in a CITIC Securities new-customer benefits promotion voice that is sweet, friendly, and highly enthusiastic, slightly fast with lively intonation and rich, natural pauses. subject1 keeps both hands overlapped on the knees, briefly claps once, then gestures with the right hand while continuing. On-screen text overlays appear in sync with the pitch, saying <S1>一定要先把中信证券三大权益领到手。</S1> subject1 continues, saying <S1>理财产品，</S1> subject1 continues, saying <S1>炒股工具，</S1> subject1 continues, saying <S1>智能选股工具，</S1> subject1 continues with a confident emphasis, saying <S1>全都有！</S1> subject1 continues with a clear call-to-action, saying <S1>点击视频下方链接，</S1> subject1 continues, saying <S1>输入手机号，</S1> subject1 continues, saying <S1>获取验证码即可锁定新客权益！</S1> subject1 continues, saying <S1>更支持一键下载中信证券 APP ，</S1> subject1 concludes, saying <S1>线上开户，方便快捷！</S1>"
