      ref_text: 跟观众分享，我人生的感悟因为我们都是，只活一次，我们也都是第一次活，我们也不知道该怎么活着。

  - job_id: gollum_single_01
    mode: single
    target_text: "No, no, do not look at it like that. It is ours, ours alone. They wants to take it, they always wants to take it, and then they says we are the thief."
    reference:
      audio: user/data_gen/prepare_reference/outputs/gollum.wav
