  - job_id: forum_four_01
    mode: multi_refs
    target_text: "<S2>If you reason from physics and economics first, a lot of so-called impossible ideas suddenly become straightforward engineering problems.</S2><S4>People do not care about theories if nothing changes in their lives. They want to see results, and they want them quickly.</S4><S1>That is exactly why infrastructure matters. When intelligence becomes cheap and scalable, every industry can be rebuilt around it.</S1><S3>But progress has to feel shared. Innovation is strongest when ordinary citizens believe it expands opportunity instead of narrowing it.</S3><S4>Opportunity is good, but weakness is expensive. If a system cannot deliver, voters move on.</S4><S1>Which is why the next era of computing has to be reliable, efficient, and accessible at global scale.</S1><S3>And guided by institutions strong enough to channel power toward the public good.</S3><S2>Yes, otherwise people optimize for habit, not truth, and the future gets built smaller than it could have been.</S2>"
