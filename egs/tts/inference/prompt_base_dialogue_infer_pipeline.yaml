      - speaker_id: 2
        audio: user/data_gen/prepare_reference/outputs/让子弹飞六爷.wav
        ref_text: 都看好了啊，今儿我肚子里要两碗粉，我白死！看见了吗？看见了吗？是不是只有一碗？是不是只有一碗？

  - job_id: htl_lyy_duo_01
