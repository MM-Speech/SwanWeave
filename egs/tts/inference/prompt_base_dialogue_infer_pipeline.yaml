    target_text: "<S1>I need you to stay with me for one minute and answer honestly, because joking your way through this will not make the decision easier.</S1><S2>Joking is the only reason I am not falling apart right now, doctor, because the honest answer is that I am scared out of my mind.</S2><S1>That fear makes sense, but we still have to choose what happens next.</S1><S2>Then tell me what gives her the most dignity, and I will try to be brave enough to hear it.</S2>"
