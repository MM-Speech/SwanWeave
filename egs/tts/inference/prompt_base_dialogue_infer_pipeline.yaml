      ref_text: <S1>No ted, this, is the big mistake right here. you owe the federal government, six hundred and seventeen thousand dollars. If you do not pay them they will come after you and then, they will come after me. And if they audit my business, find out that walt and i paid for it with close to a million dollars in untaxed gambling winnings we will go, to prison, where you will already be. Do you understand?</S1><S2>I understand you have said, but, i think you're overstateating things too no one's going to prison.</S2><S1>Oh my god how, are you not following me here?</S1>

  - job_id: doctor_patient_duo_01
    mode: dialogue_ref
