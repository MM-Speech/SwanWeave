      ref_text: 什么等下等下我看到一个留言说什么邓紫棋都四十二岁了，你算错了吧！我十年前上我是歌手的时候二十二岁啊兄弟！十年啊，二十二，加十，三十二，懂吗？懂吗？三十二不是四十二你，算错了，谁教你的数学？谁是你的数学老师？

  - job_id: jay_single_01
    mode: single
    target_text: "其实一首歌刚开始写的时候，常常只是一个很模糊的画面。你也不知道它最后会长成什么样子，但旋律一旦对了，整个世界就会慢慢亮起来。"
    reference:
      audio: user/data_gen/prepare_reference/outputs/jay.wav
      ref_text: 对我来讲是一种荣幸但是也是压力蛮大的，不过我觉得是一种，呃，很好的一个挑战。

  - job_id: jialing_single_01
    mode: single
    target_text: "人很多时候不是突然变坚强的，而是有一天你回头看，发现那些你以为过不去的时刻，居然也都被你安安静静地熬过来了。"
    reference:
