model:
  dit_exp_name: checkpoints_va/260209_prompt_base_dialogue_aligned
  dur_exp_name: none
  use_ema: true
  max_ref_duration: 60

runtime:
  output_dir: infer_out/tts_dialogue/pipeline_demo
  num_gpus: 4
  device_ids: [0, 1, 2, 3]
  skip_existing: false
  overwrite: true
  show_progress: true

infer_defaults:
