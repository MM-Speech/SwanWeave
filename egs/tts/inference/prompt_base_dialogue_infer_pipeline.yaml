  - job_id: obama_trump_duo_01
    mode: multi_refs
    target_text: "<S1>We move forward when people feel that the system still has room for them, that their voice matters, and that the future is something we build together.</S1><S2>People want strength, they want results, and they want leaders who do what they say. That is what they care about.</S2><S1>Strength without trust does not hold for very long. A nation also needs patience, seriousness, and institutions people believe in.</S1><S2>Institutions are fine, but if they fail the people, then the people want change, and they want it fast.</S2>"
    references:
      - speaker_id: 1
        audio: user/data_gen/prepare_reference/outputs/obama.wav
        ref_text: i am here, with students at, wakefield high school in arlington virginiaand. We've got students tuning in from all across america, from kindergarten through twelfth grade. And i am just so glad, that all could join us today. And i want to thank wakefield for being such an outstanding host.
      - speaker_id: 2
        audio: user/data_gen/prepare_reference/outputs/trump.wav
        ref_text: in short, we embarked on a mission to make america great again for all americans.

  - job_id: huwan_liuye_duo_01
    mode: multi_refs
    target_text: "<S1>六爷，我承认我说话冲了，可这事总得让我说个明白，不能一句规矩就把人摁死了吧。</S1><S2>规矩就是规矩！你平时拿它当笑话，到了出事的时候，又想拿道理来救自己？</S2><S1>那也得分是非黑白，不能谁嗓门大谁就占理。</S1><S2>你少给我绕弯子，今天这事儿，不是你服不服，是全城的人都在看服不服！</S2>"
    references:
