  - job_id: keegan_single_01
    mode: single
    target_text: "You do not get to waste everybody's time and then act surprised when somebody calls you out. Sit up, look at me, and decide right now whether you are serious."
    reference:
      audio: user/data_gen/prepare_reference/outputs/keegan.wav
      ref_text: I taught school for twenty years in the inner city. So don't even think about messing with me. Y'all feel me?

  - job_id: emma_single_01
    mode: single
    target_text: "Progress rarely begins with comfort. It begins when someone chooses to speak clearly, even at the risk of being disliked, because silence has simply become too expensive."
    reference:
      audio: user/data_gen/prepare_reference/outputs/Emmawaltson.wav
      ref_text: i graduated from university four years ago, i had always dreamed of going, and i know how fortunate i am to have had the opportunity to do so. Brown became my home, my community, and i took the ideas and the experiences i had there, into all of my social interactions, into my workplace, into my politics, into all aspects of my life.

  - job_id: huangrenxun_single_01
    mode: single
    target_text: "For a long time, software adapted to the computer. Now the computer is being redesigned for intelligence itself, and that shift will redefine not just products, but entire industries."
    reference:
