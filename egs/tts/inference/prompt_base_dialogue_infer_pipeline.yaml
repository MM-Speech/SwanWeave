      ref_text: 所以我觉得这些成功的电影他都很真诚，而且很有生命力，他就跟当年的那个林浩的那个一模一样。

  - job_id: dzq_single_01
    mode: single
    target_text: "等一下等一下，这里不是高音上不去的问题，是你情绪先跑太前面了。你先把气放下来，把字头咬清楚，然后我们再来一次，那个感觉就会出来。"
    reference:
