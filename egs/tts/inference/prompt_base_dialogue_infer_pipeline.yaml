  - job_id: dsm_single_01
    mode: single
    target_text: "兄弟们这波你千万不要急，表面上看是能开，实际上你一进去就会发现伤害不够、位置也不好，到时候不是你在操作，是对面在操作你。"
    reference:
      audio: user/data_gen/prepare_reference/outputs/大司马.wav
      ref_text: 我甚至可以风筝杀死一个干什么但是我就是要跟大家讲啊，没有用，你搞来搞去没有用，你只需要，等会我们三件套出来出来就是五分钟把对面搞定了，哎不搞那些花里胡哨的没用。

  - job_id: lbw_single_01
    mode: single
    target_text: "不是，这都能被翻？我跟你们说刚才那一波但凡再给我半秒钟，我直接给他操作麻了，直播间全体起立，今天谁都别想说我菜。"
