  - job_id: musk_huang_duo_01
    mode: multi_refs
    target_text: "<S1>If the cost of intelligence keeps dropping, people will not just add AI to products, they will redesign the company around it.</S1><S2>Exactly, and when that happens, computing is no longer a back office function. It becomes the engine of the business itself.</S2><S1>Which means the winning strategy is to reason from first principles instead of copying the previous generation of tools.</S1><S2>And to do that at scale, you need an entirely new stack, from chips to systems to software to deployment.</S2>"
    references:
      - speaker_id: 1
        audio: user/data_gen/prepare_reference/outputs/musk.wav
        ref_text: And then, uh I think it's also important to reason from first principles, rather than by analogy. So the normal way that we conduct our lives is we, we we we reason by analogy, uh it's we're doing this because, it's like something else that was done, or it's like what, um, other people are doing.
      - speaker_id: 2
        audio: user/data_gen/prepare_reference/outputs/huangrenxun.wav
