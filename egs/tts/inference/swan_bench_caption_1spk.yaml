    # - caption: "<ENV>整体为室内讲解口吻，收音干净清晰，带轻微房间混响，语气更像专家在旁边连续讲解。</ENV><BGM>无背景音乐</BGM><SPK>Subject1: 成熟女性，约三十五到四十五岁，职业装气质沉稳；音色清亮、吐字清晰，语速中等偏快，逻辑感强，语气亲切但有权威感。</SPK>Subject1用领域专家的连贯旁白，把痛点、解决方案与利益点串联，语气先共情再给结论，结尾带号召力度：<S1><|sp|>很多姐妹盖白发是不是总会染到头皮，染完发质还变得像枯草一样？别急，我今天想用更简单、更健康的方式帮你解决这件事。推荐你试试美飘扬的单剂染发膏，核心就是不沾头皮、盖白发、还免调配。植物配方更温和，而且不添加双氧水，染的时候头皮不刺痛不发痒，敏感一点的也更安心；染完头发摸起来依旧是软软的，不会干涩打结。遮盖白发的效果也很直观，不管是头顶新长的白发还是两鬓顽固白发，覆盖后颜色更自然，不会显得假黑。更关键的是它固色时间长，一百八十天不容易褪色，洗头水也更清，不用频繁补染，省心也更省钱。如果你正在为白发和染发伤发、沾头皮、操作复杂发愁，健康染发选它就对了。<|sp|></S1>"
    
