    # - caption: "<ENV>家庭卫生间室内环境，近距离收音更清晰，空间较小带轻微瓷砖反射的短混响。</ENV><BGM>无背景音乐</BGM><SPK>Subject1: 成熟女性，约四十岁上下，职业感强，气质沉稳专业；音色清亮偏中频，咬字清晰，语速偏快但有条理，语气亲切又有说服力。</SPK>Subject1以专业推荐的口吻开场，语速利落，带一点“替你解决问题”的笃定感：<S1><|sp|>盖白发总染到头皮？染后发质变差像枯草？别急，今天给姐妹们推荐一款真正不伤发的染发神器！<|sp|></S1>句末语调上扬收住，强调“推荐”和“神器”，整体更像近距口播。"
