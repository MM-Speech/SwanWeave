bench: audio
out_path: infer_out/prompttts
cfg_w: [1.5,3.0] 
timestep_annealing_w: [1.0,0.0,1.0]
use_amo_sampler: false
use_sway: false
num_step: 100
use_sa_front: True
cpm: 280
negative_prompt: distorted audio, background static, microphone clipping, echo, excessive reverb, overlapping voices, low signal-to-noise ratio, unnatural artifacts, robotic tone, unstable volume, inconsistent pitch, harsh high frequencies, muffled sound
samples:
  Waver Bench:
    - caption: "<SPK>Subject1: A young East Asian man, around 20-25 years old, sitting in the center of the frame. He has dark, wet hair plastered to his forehead and an expression of complete despair. He is wearing a white shirt that is soaked through and clinging to his body, along with dark trousers. His voice is low, trembling, and filled with despair.</SPK> The overall environment sound is the constant, heavy downpour of rain <Audio>heavy rain falling</Audio>. The young man sits motionlessly on the bench, looking completely lost and dejected. Rainwater drips from the tips of his hair and down his face. He stares down at the dark, lifeless screen of his phone. <Audio>distant roll of thunder</Audio>. After a moment, a bitter, self-mocking laugh escapes him as he whispers in a near-desperate tone, <S1>哈，连最后一次机会都不给我吗？</S1>. A car drives by in the background, its tires loudly splashing through a puddle <Audio>sound of a car splashing through water</Audio>."
    - caption: "<SPK>Subject1: An elderly Chinese man, around 70-80 years old, with a spirited and healthy appearance, short grey hair, and gentle wrinkles, positioned in the center of the frame. He is wearing a traditional white tai chi uniform. His voice is soft, gentle, and has a low pitch, conveying a sense of contentment.</SPK> The overall environment sound is a mix of crisp birdsong <Audio>bird chirping</Audio> and the faint, distant murmur of a morning exercise crowd. Subject1, who has been practicing tai chi, completes a final, graceful closing move. He then slowly and audibly exhales a long breath <Audio>sound of a slow, deep exhale</Audio>. He turns his gaze towards the rising sun, a look of deep satisfaction spreading across his face as he smiles gently. He then says softly to himself, <S1>又是舒坦的一天啊。</S1>."
    - caption: "<SPK>Subject1: A young Chinese woman in her early 20s, with her hair tied up in a messy bun and streaks of colorful paint on her face. She is wearing a paint-stained oversized shirt over jeans. Her voice is clear, medium-pitched, and filled with frustration.</SPK> The overall environment sound is the gentle melody of classical music playing from a radio in the background, punctuated by the faint sound of a paintbrush rubbing on a palette <Audio>sound of paintbrush on palette</Audio>. The young female painter takes a few steps back from the large canvas to get a better view of her work. She stands with her brow furrowed in deep thought. Showing her frustration, she raises a hand and scratches her hair <Audio>sound of scratching hair</Audio>. After a moment of intense scrutiny, she lets out a sigh and complains to herself in disappointment, <S1>不对，感觉完全不对。</S1>"
    - caption: "<SPK>Subject1: A male university student, around 20-22 years old, with short black hair, wearing black-rimmed glasses and a plaid shirt. He is standing between library bookshelves. His voice is a clear, excited, low-pitched whisper.</SPK> The overall environment is extremely quiet, typical of a library, with only the <Audio>faint sound of pages turning</Audio> audible in the distance. The student's eyes light up as he spots the book he's been searching for. He carefully reaches out and slides the old book from the shelf <Audio>sound of a book being gently removed from a shelf</Audio>. He holds it in his hands, brings it closer to his face, and gently blows a small cloud of dust from its cover <Audio>soft puff of air blowing dust</Audio>. A look of relief and excitement spreads across his face as he whispers to himself, <S1>太好了！终于找到了！</S1>."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the gentle crackle of hot oil. An egg is cracked and dropped into the pan <Audio>sound of egg cracking and plopping into oil</Audio>. The instant the egg white hits the hot oil, it erupts into a loud, enticing sizzle <Audio>aggressive sizzling and frying sounds</Audio>. The translucent egg white immediately turns opaque and bubbles vigorously, with its edges becoming crispy and golden-brown. The bright yellow yolk stays in the center, its surface trembling slightly amidst the bubbling oil."
    - caption: "<SPK>No subjects.</SPK>The overall environment is silent, focusing all auditory attention on the action. A pair of hands firmly grips a dark chocolate bar horizontally. The hands apply increasing pressure, bending the bar until it suddenly snaps cleanly into two perfect halves, producing a very crisp and satisfying snapping sound <Audio>crisp, clean snapping sound of chocolate breaking</Audio>. The hands hold the two separated pieces for a brief moment."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the gentle rustling of leaves in the wind. A person is walking through the forest. The camera tracks a pair of brown leather boots as they step firmly onto the thick layer of dry leaves. With each step, the boots press down, creating a crisp and satisfying crunching sound <Audio>crisp crunching sound of dry leaves breaking</Audio>. The person continues walking, and with every step, the same pleasant crackling sound is heard <Audio>crisp crunching sound of dry leaves breaking</Audio>."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the intense roar of a powerful hailstorm. A sudden storm begins as dense, bean-sized hailstones plummet from the sky. They bombard the metal roof of the car, creating a loud, chaotic, and rapid tapping percussion <Audio>intense, rapid tapping sounds of hailstones hitting metal</Audio>. The hailstones are seen bouncing off the car's surface upon impact as the storm continues to rage."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is a faint, quiet hallway ambiance. The scene opens with a still shot of the closed apartment door. A hand enters the frame from the side, curls its fingers, and knocks firmly on the door three times <Audio>knocking sound three times</Audio>. After a brief pause, a distinct click is heard from the door's lock <Audio>sound of a lock clicking</Audio>, and then the door begins to swing inward, opened from the inside."
    - caption: "<SPK>Subject1: A female jazz singer, appearing to be in her mid-30s, with wavy dark hair styled over one shoulder, smoky eye makeup, and red lipstick. She is wearing a shimmering, form-fitting gold sequin dress. Her voice is a low, husky, and melancholic whisper.</SPK>The overall environment sound is the <Audio>faint, intermittent clinking of glasses being cleaned</Audio> from an unseen bar area. The singer stares wistfully into her half-empty whiskey glass, her expression one of quiet weariness. She slowly swirls the liquid, causing the <Audio>ice to clink softly against the glass</Audio>. She lets out a soft, almost inaudible sigh, then whispers to herself in a low, husky tone, <S1>Another night, another empty room.</S1> Her gaze remains fixed downward into the glass as the scene ends."
    - caption: "<SPK>Subject1: A rugged, middle-aged Caucasian man, around 40-50 years old, with a weathered face and short, wind-tousled hair. He is wearing a thick, heavy-knit sweater. His voice is deep, strained, and slightly raspy, conveying a sense of urgency.</SPK>The scene is dominated by the constant, deafening sound of a <Audio>howling wind</Audio> and the <Audio>deep roar of the ocean</Audio>. Subject1 stands firm against the wind, staring out at the stormy sea. He holds a satellite phone to his ear, listening intently. His voice is strained as he speaks into the phone, his words punctuated by <Audio>crackling static</Audio>. He says, <S1>The signal is breaking up... The storm is worse than they predicted!</S1> as another powerful <Audio>gust of wind</Audio> whips past and a massive wave <Audio>crashes loudly</Audio> against the cliff face below."
    - caption: "<SPK>Subject1: A scientist, a Caucasian man in his late 60s, with wild, unkempt grey hair and a wrinkled face. He is wearing a sterile white lab coat. His voice is a low, trembling whisper filled with a mix of terror and awe.</SPK>The overall environment sound is the low, steady hum of advanced machinery. The scientist is hunched over, peering intently into the eyepiece of a large, complex microscope. His expression shifts from intense concentration to shock as his eyes widen dramatically. He pulls back slightly, his face a mask of terror and profound awe, and he mutters in a trembling whisper, <S1>My God... it's learning.</S1>"
    - caption: "<SPK>Subject1: A teenage girl, around 16-18 years old, Caucasian, with long, light-brown hair. She is wearing denim overalls over a simple t-shirt and has a pensive, nostalgic expression. Her voice is a soft, quiet whisper filled with longing.</SPK>The overall environment sound is the gentle, constant chirping of crickets from outside <Audio>sound of crickets chirping</Audio>. The girl sits on the floor, her gaze fixed on the old photograph. She gently traces the image of the young couple with her index finger, a wistful look on her face. Leaning slightly forward, she whispers softly, <S1>I wish I could have known you then.</S1> She continues to stare at the photograph, lost in thought, as the scene ends."
    - caption: "<SPK>Subject1: A young Japanese man, likely in his early 20s, sitting at the corner of a bar. He is wearing a black hoodie. His voice is soft, low-pitched, and whisper-like.</SPK>The overall environment sound is the gentle noise of the kitchen, primarily the sound of the chef cooking noodles <Audio>sound of boiling water</Audio>. The young man looks down at the steaming bowl of ramen before him, a look of relief on his face. He leans forward slightly and whispers in a quiet voice, almost to himself, <S1>やっと終わった，いただきます。</S1>"
    - caption: "<SPK>Subject1: A Japanese woman, around 30-35 years old, with elegant features and dark hair styled in a traditional updo. She is dressed in a light purple kimono and is holding a traditional oil-paper umbrella. Her voice is soft, gentle, and has a slightly melancholic, medium-to-low pitch.</SPK>The overall environment sound is the gentle, rustling sound of wind blowing through the bamboo leaves <Audio>sasa sound of wind in bamboo</Audio>. Subject1 walks slowly and gracefully along the path, her soft footsteps barely audible <Audio>sound of soft footsteps on the path</Audio>. She then comes to a stop, her gaze fixing on a bamboo stalk with a nostalgic expression on her face. She sighs softly and says <S1>もう十年か，何も変わらないね。</S1> as the wind continues to whisper through the forest."
    - caption: "<SPK>Subject1: A young Korean woman in her early to mid-20s, with long dark hair, sitting alone on a bench. She wears a beige trench coat. Her voice is a soft, gentle, and low-pitched whisper.</SPK>The overall environment sound is a mix of the gentle lapping of water and a faint, distant city hum. Subject1 sits alone, her gaze fixed on the river surface with a thoughtful and slightly melancholic expression. She then whispers softly to herself, saying <S1>결국 이렇게 됐네， 다 괜찮을 거야.</S1>. Shortly after, the faint sound of a distant riverboat whistle is heard <Audio>distant riverboat whistle</Audio>."
    - caption: "<SPK>Subject1: A teenage Korean boy, around 16-18 years old, standing in the center of the frame. He has short, slightly messy black hair and a tired expression. He is wearing a school uniform, consisting of a white button-up shirt and dark trousers. His voice is low-pitched, quiet, and weary.</SPK>The overall environment sound is the low, steady hum of the store's freezers and the whirring of the microwave. Subject1, looking exhausted, stares intently at the bento box rotating inside the microwave. He lets out a tired yawn <Audio>sound of a yawn</Audio>. Then, he mutters to himself in a low voice, <S1>아, 배고프다.</S1>. In the background, the chime of the store's entrance bell rings <Audio>sound of a welcome chime</Audio> as someone enters or leaves."
    - caption: "<SPK>Subject1: A young Thai woman, around 20-30 years old, with long black hair, wearing a modest white blouse. She is kneeling in the center of the frame. Her voice is soft, gentle, and reverent, with a medium pitch.</SPK>The overall environment sound is a quiet, peaceful temple ambiance. Subject1 kneels with her hands clasped together in a prayer gesture and her eyes closed. She prays softly in a gentle, reverent tone, saying <S1>ขอให้ครอบครัวของฉันแข็งแรง</S1>. In the background, the gentle tinkling of wind chimes can be heard <Audio>sound of wind chimes tinkling</Audio>."
    - caption: "<SPK>Subject1: An elderly Russian man, around 70-80 years old, with a weathered, wrinkled face, standing on the platform. He is wearing a traditional ushanka hat and a thick, dark wool coat. His voice is low-pitched, slightly gravelly, and soft.</SPK>The overall environment sound is the vast, echoing ambiance of the metro station, with faint sounds of distant footsteps. The elderly man waits patiently. Suddenly, the deep rumble of an approaching train fills the station, growing progressively louder <Audio>sound of a train rumbling on tracks</Audio>. As the train pulls in, its lights sweep across the man's face, and it slows to a stop with a loud screech of brakes <Audio>sound of train brakes squealing</Audio>. The man watches it arrive and softly mutters <S1>Наконец-то.</S1>."
    - caption: "<SPK>Subject1: A young Russian woman in her early 20s, with light brown hair, sitting by a window. She wears a traditional white blouse with intricate floral embroidery. Her voice is soft, gentle, and has a melancholic, low-pitched tone.</SPK>The ambient sound is the gentle crackling of firewood in the hearth <Audio>sound of crackling wood</Audio>. The woman sits, holding a balalaika. She gently plucks the strings, producing a soft, melodic tune <Audio>sound of balalaika strings being plucked</Audio>, and then begins to sing softly in a low, melancholic voice, <S1>Ой, то не вечер，</S1>."
    - caption: "<SPK>No subjects.</SPK>The scene is quiet with a faint, calm room ambiance. The cat, sitting calmly on the wooden floor, slowly raises its head, its gaze directed slightly upward and off-camera. It then opens its mouth and lets out a <Audio>sweet, slightly prolonged meow, gentle and full of expectation</Audio>."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the faint chirping of birds in the distance. The Golden Retriever looks directly into the camera, its tail wagging vigorously just out of the frame. It opens its mouth and lets out a series of loud, friendly barks <Audio>happy dog barking sounds</Audio>, its expression full of excitement and joy."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the faint, ambient chirping of night insects <Audio>faint chirping of night insects</Audio> and the gentle lapping of water <Audio>gentle lapping of water</Audio>. A green frog sits on a lotus leaf. Its throat pouch visibly inflates and deflates as it lets out a series of deep, rhythmic croaks <Audio>rhythmic frog croaking</Audio>. With each croak, tiny ripples spread across the dark water surface around the lotus leaf."
    - caption: "<SPK>Subject1: A motorcyclist of unspecified gender and age, wearing a full-face helmet that obscures their features, clad in a protective black leather jacket and gloves.</SPK>The overall environment sound is a blend of rushing wind and the faint sound of tires on asphalt. A motorcyclist speeds along the deserted coastal highway. The tracking camera keeps pace with the motorcycle, maintaining a close-up view. The motorcycle's powerful engine lets out a deep, powerful roar <Audio>deep, powerful engine roar</Audio> that reverberates through the open air, dominating the soundscape."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is a mix of city traffic and the powerful sounds of the emergency vehicle. An ambulance races urgently down the city street. <Audio>A sharp, urgent, and approaching ambulance siren wails (wee-woo, wee-woo)</Audio>. Its powerful engine roars and its tires hiss on the wet pavement as it weaves through other cars <Audio>sound of a heavy vehicle engine and tires on a wet road</Audio>. The ambulance speeds past the camera, the siren sound peaking in volume before starting to recede into the distance."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is a mix of mechanical noises and steam. An old-fashioned steam train moves steadily along the railway tracks. Its massive wheels turn, creating a powerful and rhythmic clanking sound as they make contact with the rails <Audio>rhythmic 'clank, clank, clank' of wheels on track</Audio>. At the same time, the engine releases billows of steam with a distinct and continuous hissing noise <Audio>hissing of steam</Audio>."
    - caption: "<SPK>Subject1: A female pianist, East Asian, around 25-35 years old, with her long dark hair elegantly styled. She is wearing a black evening gown.</SPK>The only sound is the beautiful piano music. The camera holds a tight focus on the pianist's hands. Her slender fingers move gracefully and with precision across the keyboard, elegantly pressing the black and white keys. As her hands dance over the piano, a stream of crisp, melodious notes flows out, forming a beautiful and elegant melody <Audio>sound of an elegant and flowing piano melody</Audio>."
    - caption: "<SPK>Subject1: A male musician, around 30-40 years old, with neat black hair. He is wearing a formal black tuxedo with a white dress shirt and a black bow tie. His voice is not heard.</SPK>The scene is filled with the sound of a violin playing a long, emotional, and high-pitched melody. The male musician stands completely absorbed in his performance, his eyes closed. He gracefully and passionately draws the bow across the violin strings, causing them to vibrate and produce the beautiful, soaring music. His body sways slightly with the rhythm of the piece."
    - caption: "<SPK>Subject1: A female drummer, East Asian, in her mid-20s, with long dark hair tied back, wearing a black band t-shirt and ripped jeans. She is positioned center stage behind a drum kit, her expression one of intense focus.</SPK>The predominant sound is the raw, amplified power of the drum kit. The female drummer plays with speed and force, her arms a blur of motion. She begins by powerfully striking a drum, producing a deep, resonant boom <Audio>powerful drum hit</Audio>, and immediately follows with a crisp, explosive strike on a cymbal <Audio>sharp cymbal crash</Audio>. She then delivers a quick, forceful double hit on the drums <Audio>rapid double drum beat</Audio>, followed by another resounding <Audio>sharp cymbal crash</Audio>, creating a driving, powerful, and rhythmic beat."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the constant roar of agitated ocean waves <Audio>sound of crashing waves</Audio> and the escalating wind of an approaching storm. The scene is dark and moody. Suddenly, a massive, brilliant fork of lightning splits the dark sky, momentarily illuminating the entire scene in a stark, bright flash. After a few seconds of tense silence, a deep, rumbling clap of thunder echoes across the landscape <Audio>a deep, rumbling and powerful clap of thunder</Audio>. Immediately following the thunder, a torrential downpour begins, with heavy rain falling in sheets <Audio>sound of a heavy downpour</Audio>."
    - caption: "<SPK>No subjects.</SPK>The overall environment is filled with the continuous, deafening roar of the waterfall. An immense volume of water pours relentlessly over the edge of a high cliff, falling in a powerful, unbroken stream. It crashes violently into the pool below, generating enormous plumes of white spray and a swirling mist that rises into the air <Audio>continuous, loud roaring and crashing sound of water</Audio>. The water in the pool churns and eddies from the constant force of the cascade."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the gentle chirping of night insects. A large bonfire burns brightly in the darkness. Flames of vibrant orange and red leap and dance upwards, sending glowing embers into the night air. The firewood within the blaze shifts and settles, periodically emitting a sharp, crackling and popping sound <Audio>sound of wood crackling and popping</Audio>, creating a warm and cozy atmosphere."
    - caption: "<SPK>No subjects.</SPK>The scene begins with the sound of liquid being poured <Audio>sound of pouring liquid</Audio>. A stream of dark brown, ice-cold Coca-Cola flows from the bottle into the glass, weaving its way between the ice cubes. As the cola fills the glass, it erupts in a cascade of bubbles, creating a vigorous fizz <Audio>hissing and bubbling sounds</Audio>. The ice cubes shift and jostle from the force of the pour, bumping against each other and the sides of the glass, creating a series of sharp, crisp clinking noises <Audio>clinking sound of ice cubes</Audio>. The foam rises briefly before settling, revealing the bubbly, dark liquid mingling with the glistening ice."
    - caption: "<SPK>Subject1: An Asian male boxer, around 25-35 years old, with a muscular and athletic build. He is wearing red boxing gloves, black athletic shorts, and a grey tank top, with a focused and determined expression on his face.</SPK>The overall environment sound is a low hum of gym ambiance. The boxer stands before the heavy punching bag and begins to deliver a continuous series of powerful strikes. Each punch lands with a deep, dull thud <Audio>heavy thudding sounds of punches landing</Audio>, causing the heavy bag to swing back and forth violently. The chains supporting the bag rattle with the movement <Audio>sound of chains rattling</Audio>. The boxer lets out occasional grunts of effort with his powerful punches <Audio>grunts of exertion</Audio>."
    - caption: "<SPK>Subject1: A young man, around 18-22 years old, Caucasian, with messy blond hair peeking out from under a black beanie, wearing a loose-fitting grey hoodie, black jeans, and skate shoes. Vocal timbre is not applicable as there is no speech.</SPK>The overall environment sound is the low hum of city life mixed with the faint sound of distant traffic. Subject1, the skateboarder, approaches the metal rail at high speed, his wheels making a rumbling sound on the concrete <Audio>sound of skateboard wheels rolling on pavement</Audio>. As he gets close, he performs an ollie, with the tail of his board making a sharp pop against the ground <Audio>sharp 'pop' sound of the skateboard tail hitting the ground</Audio>. The board lifts into the air, and he lands with the trucks on the metal rail, beginning a long grind. The board sliding against the metal produces a loud, piercing screeching sound <Audio>a long, harsh metallic grinding sound</Audio>. He maintains his balance along the length of the rail before popping off the end and landing smoothly back on the pavement <Audio>sound of skateboard landing on concrete</Audio>."
    - caption: "<SPK>Subject1: A young man in his early 20s, with an athletic build and short black hair, wearing a red basketball jersey and black shorts.</SPK>The overall environment sound is the faint ambiance of a quiet outdoor space. A young man is in the middle of the court, energetically dribbling a basketball. The camera follows him as he moves across the court. He dribbles the ball hard against the ground, causing it to bounce up high with a powerful and rhythmic beat <Audio>forceful, rhythmic sound of a basketball dribbling</Audio>, which echoes across the empty court. His sneakers make sharp sounds as he shifts his feet on the pavement <Audio>squeak of sneakers</Audio>."
    - caption: "<SPK>No subjects.</SPK>The scene begins with a faint, quiet room ambiance. The smartphone lies inactive on the table. Suddenly, its screen illuminates brightly, and it begins to vibrate while a crisp, default ringtone starts to play <Audio>phone vibrating and ringing</Audio>. After a few seconds, a hand enters the frame from the right, reaching for the phone. A finger touches the screen and performs a swiping gesture to answer the call <Audio>sound of a finger swiping on a screen followed by a soft click</Audio>. The ringtone and vibration cease abruptly as the call is connected."
    - caption: "<SPK>No subjects.</SPK>The scene begins in complete darkness and silence. A hand holding a metal lighter appears. The thumb flicks open the lighter's cap, producing a sharp sound <Audio>crisp metallic click of a lighter cap opening</Audio>. Immediately following this, the thumb spins the flint wheel <Audio>sound of a flint wheel striking</Audio>, and a small cluster of flames ignites, casting a bright, flickering light in the darkness."
    - caption: "<SPK>Subject1: A Chinese man, around 40-50 years old, a market stall owner. He has a friendly, weathered face and is wearing a simple t-shirt and an apron. His voice is loud, resonant, and has a strong local accent, amplified by a megaphone.</SPK>The overall environment sound is the chaotic din of a busy market, with the murmur of crowds and distant calls from other vendors. Subject1 stands at his stall, lifts a large megaphone to his mouth, and shouts loudly, his voice echoing through the market: <S1>新鲜的蔬菜，便宜卖啦！</S1> The sound is amplified and carries his distinct local accent."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is the faint, cold sound of wind and the gentle lapping of water against the ice shelf. On the edge of the massive glacier, a visible crack begins to form and rapidly widens. This is accompanied by a loud, crisp, and deep cracking sound <Audio>a loud, deep cracking sound</Audio>. A massive chunk of the glacier, forming a new iceberg, shears off and dramatically falls away from the main ice shelf. It plummets into the sea below, creating a colossal splash and a deep rumbling sound as it hits the water <Audio>massive splash and deep rumbling sound</Audio>, sending waves rippling outwards."
    - caption: "<SPK>Subject1: A woman, around 30 years old, with long dark hair, wearing a stylish beige trench coat, a white top, and blue jeans.</SPK>The overall environment sound is the low hum of distant traffic. Subject1 exits the sedan and steps onto the pavement. She then turns back and forcefully slams the car door shut, which closes with a heavy, solid thud <Audio>heavy car door slam</Audio>. Immediately afterward, the car's electronic lock engages with two distinct, sharp beeps <Audio>electronic car lock beeps</Audio>. She pauses for a second beside the now-secured vehicle."
    - caption: "<SPK>No subjects.</SPK>The overall environment sound is a low, subtle electronic hum mixed with a faint echo. A bipedal humanoid robot walks at a steady pace through the futuristic corridor. With each step, its complex mechanical joints and heavy metal feet make a distinct, rhythmic sound against the floor, conveying a sense of weight and precision <Audio>heavy and precise mechanical clanking sound</Audio>. This sound repeats with every step as the robot moves forward."
    - caption: "<SPK>Subject1: A shirtless blacksmith, a rugged man around 40-50 years old, with a muscular and sweaty upper body, wearing dark, heavy-duty work trousers.</SPK>The overall environment sound is the low roar and crackle of the forge fire. The shirtless blacksmith uses a pair of iron tongs to hold a glowing, red-hot piece of iron firmly on the anvil. He then raises a large sledgehammer high above his head and brings it down with great force, striking the iron. Each powerful blow produces a loud, clear clang <Audio>loud, clear clang of a hammer striking hot metal</Audio>, sending a brilliant shower of orange sparks flying into the air. He continues to hammer the iron rhythmically, the resounding <Audio>clang, clang</Audio> echoing through the workshop with each strike."
