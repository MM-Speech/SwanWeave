bench: mega
out_path: infer_out/swan
cfg_w: [1.4,3.0]
timestep_annealing_w: [0.6,0.4,1.0]
use_amo_sampler: false
use_sway: true
num_step: 100
rate: 1.1
samples:
  Zero-shot-CN-10to20s:
  - prompt_audio: prompts/双人bench_final/test/1-健谈大爷.wav
    text: '<S1>一九五五到一九八零年出生的您注意了！您的二零二五新款超声波洗菜盆专属优惠，已送达！别划走！这份福利正等着您签收！如果这次您再错过，优惠名额将转给他人。但现在，它依然属于您！点击下方链接，立即锁定您的优惠！名额已发送至您的手机。今天不参与，资格即失效！无论多忙，只需几秒就能抢到手！无需转发！无需下载！看到即得！所见即所得！现在参与，最快明天到货！名额告急，错过后悔莫及！赶紧点击下方链接，抢占最后名额！</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-利落小哥哥.wav
    text: '<S1>朋友你好，我实在忍不住要告诉你。视频开始之前，想跟你真心实意的讲几句，往后也许没什么机会和你交流了。从刚认识你其我就对你超级崇拜我。毕竟你能有今天的成就，全是辛苦努力换来的。即便事业有成你，依旧低调，且格局大，还怀着感恩之心，帮了好多人，网上到处都是对你的称赞。你直阳光无私，充满正能量，还总爱帮助别人。</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-爽朗大叔.wav
    text: '<S1>打算开零食店的注意了，千万别再盲目交钱加盟了，一定小心别被快招公司骗了。如果你真想开一家零食店，又不知道如何避坑，那就赶紧，免费领取这份零食店开店资料吧。这里面有，二零二五年食品行业调查报告、品牌避坑指南、开店地址评估表、回本周期计算表，还有一对一的分析咨询，全是干货。告诉你如何开好一家零食折扣店，教你如何避免陷阱。想要免费领取资料的，点击下方链接即可领取。</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-稳重奶奶.wav
    text: '<S1>家人们，我必须给大家分享一下这款宠物鱼油胶囊。如果你家的猫狗掉毛严重，到处都是毛，那你一定得试试这个。它富含高浓度的欧米伽三和各种维生素，口感很好，可以直接喂食，也可以拌在猫粮或喜欢的零食里。这是专为猫狗设计的，每一瓶都有八十粒，只需要一杯奶茶的钱。现在厂家直接发货，性价比超高，赶紧下单吧！</S1>'
  - prompt_audio: prompts/双人bench_final/有声场女/1-干练白领.wav
    text: '<S1>现在点击下方链接，从源头厂家直接发货到您手中，没有任何的中间环节加价。厂家开启了绿色通道，点击下方链接给自己牙齿一次调理的机会吧。</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-爽朗大姐.wav
    text: '<S1>家人们，你们能拍三单就拍三单，能拍两单就拍两单。现在是来大活动了，马上就结束了，你赶紧去拍。今天九十九都不要了，直接到手。二三十块钱一盒，你拍的越多越划算。咱就一盒给自己，两盒给姐妹，三盒给婆婆。四盒给母亲，原来一百一十九一盒的妤医堂血红素铁维C软胶囊，现在是两大盒，不到六十块钱。我说好不算好，你得亲自试试才知道。这个气血问题引起的月经不好，缺铁性贫血，你每天都吃两粒，干枯掉发，口干口苦，指甲有竖纹，你真的可以去试试它。你别说你买不起。为了让咱朋友们不再买到次品，我们直接打开了一个厂家购买渠道，人人都用得起，只需要每天吃两粒，在家自己调理你这个气血不足导致的缺铁性贫血难题啊，气血不足、月经不好的你啊，现在就点击视频下方链接去查看详情吧！</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-雅致大爷.wav
    text: '<S1>你的手机是不是也是这样。刚买没多久就提示内存不足，手机卡到用不了，动不动就发烫死机，这是内存占用过大导致的，还有很多人不知道怎么清理手机垃圾，打开这个开关，就能一键清理，方法放到左下方了。需要的赶去去看看吧！</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-亲切美姨.wav
    text: '<S1>现在下载，马上视频，敢不敢来试试，我们可以聊点有趣的，平时不敢的，在这里都可以说出来，不用加好友，聊天内容你来定，我们聊什么别人都不会知道，可以语音聊，也可以视频聊，快来吧我在这里等你</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-热情带货男声.wav
    text: '<S1>哎呦 ，你终于刷到这条视频了，为什么给你申请的四季营养食谱书的名额，你就是不领取呢?现在我最多再给你保留一小时，再不领取啊，就要自己花钱学食补养生了，领到手上反复观看，谁学谁受益。不管你现在忙不忙，我都建议你先点击下方去领一套，关键的时候啊 ，能派上大用场。不需要下载，也不用填写个人的信息，点击下方链接，四季营养食谱书一次性打包发送给您，只需点击下方链接即可领取，马上点击视频链接领取学习吧。</S1>'
  - prompt_audio: prompts/双人bench_final/有声场女/1-热情带货女声.wav
    text: '<S1>立刻停下手上的事！如果你家的马桶总是发霉发臭，那这条视频你一定要看完！前几天，我婆婆来家里，一进卫生间就皱眉头，说这味道实在受不了。后来同事推荐了这款香氛洁厕泡泡，我抱着试试的心态买了，没想到效果真的绝了！它不仅轻松除垢，还不伤表面，最重要的是，它不是简单掩盖臭味，而是能彻底清洁，让马桶闻起来清新。用了几次之后，连我老公都夸它好用，说家里的卫生间再也没那股恼人的异味了。全家人都爱用，真的省心不少。如果你也在为马桶问题头疼，这款泡泡值得一试，拍一发二，划算得很！</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-健谈大爷.wav
    text: '<S1>我炒股十五年，前十年就像在迷宫里瞎撞，机构用量化盯盘时，我还在手动画K线;主力一秒调仓，我得翻半小时新闻。直到遇见彦明老师的《连阳手册》，才明白散户和机构的差距，根本不是技术，是工具!里面四套神秘代码，点一下就能跟紧主力，比游资下单还快。最关键的是，六块九买手册，直接送彦明老师的千元课程。老师手把手拆解机构操盘套路，教你怎么用代码锁死起爆点。别觉得量化高深，手册里连七十岁大爷都能看懂的步骤图，搭配课程里的实时演示，三天就能上手。现在才明白，我过去亏的不是钱，是没找对方法。想让你的账户翻身?六块九换个对抗机构的机会，赶紧抢!</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-利落小哥哥.wav
    text: '<S1>都不要慌，我们银行推出的车享贷，专治各种穷急！如果你是全款车主，可以凭车辆信息及相关资料申请，最高能贷到车价估值的九成，最长可以分二十四期或三十六期慢慢还，最快当天放款。钱到手车还能照开，一点都不影响正常用车。好机会可不多，需要的朋友，赶快点击下方链接申请吧！</S1>'
  - prompt_audio: prompts/双人bench_final/test/1-爽朗大叔.wav
    text: '<S1>一九五五到一九八零年出生的您注意了！您的二零二五新款超声波洗菜盆专属优惠，已送达！别划走！这份福利正等着您签收！如果这次您再错过，优惠名额将转给他人。但现在，它依然属于您！点击下方链接，立即锁定您的优惠！名额已发送至您的手机。今天不参与，资格即失效！无论多忙，只需几秒就能抢到手！无需转发！无需下载！看到即得！所见即所得！现在参与，最快明天到货！名额告急，错过后悔莫及！赶紧点击下方链接，抢占最后名额！</S1>'
