base_config:
- egs/tts/config_base.yaml
# - egs/tts/datasets/swan_base_dataset.yaml
# - egs/tts/datasets/spat_edit_base_dataset.yaml
- egs/tts/datasets/spat_edit_dataset.yaml

# task
task_cls: tasks.tts.spat_audio_edit_task.SpatAudioEditTask

# audio
fft_size: 2400
hop_size: 480
win_size: 2400
audio_sample_rate: 44100
f0_max: 600
f0_min: 60
fmax: 24000
fmin: 0

# data
frames_multiple: 4
dataset_cls: tasks.tts.dataset_utils.spat_base_fastdataset.SpatBaseShmDataset
# val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
use_audio_dataset: False

# dataloader
eval_max_batches: 0
ds_workers: 12
max_tokens: 3000
max_sentences: 100
max_frames: 6000   # 5min
min_frames: 100
tgt_size_max: 6000
tgt_size_min: 100
fast_ds_prefetch_steps: 2

online_text_alignment_task: False
online_text_alignment: False
online_text_alignment_batch_size: 32
online_text_alignment_work_dir: user/service_cache/asr

pipeline_cache_future: False
pipeline_prefetch_aligner: True
pipeline_prefetch_vae: True

shuffle_spk_ids: False

# model
model_size: base # small, 2b, 3b, base
train_base: false  # true: original text-to-audio model; false: audio editing model with edit_lat_proj
init_edit_lat_proj_from_t2a: true
use_cosyvoice2_text_tokenizer: False
mix_text_pinyin:
  enable: true
  enable_prob: 0.4
use_spk_mask: False
use_gated_attention: False
use_dynamic_cross_gate: True
encoder_ffn_mult: 4.0
drop_ref_wav: 0.5

# MoE FFN. Keep disabled by default; set use_moe_ffn: true to replace selected
# DiT FFN layers with routed experts plus caption-selected task experts.
use_moe_ffn: False
moe_use_ec: False
moe_p: 0.7
moe_num_routed: 4
moe_num_shared: 0
moe_num_task_experts: 4
moe_task_p: 0.7
moe_num_null: 1
moe_expert_dropout: 0.05
moe_use_gumbel: False
moe_use_bias_balance: False
moe_bias_update_rate: 1.0e-3
moe_bias_momentum: 0.9
moe_bias_clamp: 3.0
moe_aux_loss_weight: 1.0
moe_aux_anneal_steps: 200000
moe_load_balance_loss_coef: 1.0e-2
moe_router_z_loss_coef: 1.0e-3
moe_null_loss_coef: 1.0e-2
moe_capacity_factor_min: 1.3
moe_capacity_factor_max: 2.5
moe_overflow_drop: True
moe_use_t_budget: True
moe_p_min: 0.55
moe_p_max: 0.90
moe_null_logit_bias_min: -2.5
moe_null_logit_bias_max: -0.2
decoder_sparse_step: 1
mlp_only_layers: []
moe_intermediate_size: null

# caption encoder
use_caption: True
caption_encoder_dim: 1024
use_caption_text_mark: False
pretrained_text_encoder_qwen: /mnt/bn/sa-ag-data/leike/spatial_edit/ScriptSpeech/checkpoints/Qwen3-0.6B
text_max_token_length: 256

latent_dim: 128
vae_stride: 4
stable_audio_model_config: stable_audio_tools/configs/model_configs/autoencoders/stable_audio_2_0_vae.json
stable_audio_vae_ckpt: checkpoints/vae/diffusion_pytorch_model.safetensors
stable_audio_vae_dtype: float32
stable_audio_vae_chunked: true
stable_audio_vae_chunk_size: 128
stable_audio_vae_overlap: 32
stable_audio_foa_pair_a:
- 0
- 1
stable_audio_foa_pair_b:
- 2
- 3
vae_ckpt: ''
latent_norm_mode: global
vae_encode_chunk_sec: 120
vae_encode_max_batch_size: 128
vae_deterministic: False

load_ckpt: checkpoints/260516_spat_base_base
use_fsdp: false
sharding_strategy: hybrid
gradient_checkpointing: false

use_ema: False
ema_decay: 0.9999

val_check_interval: 1000

# training
# Muon (2D 矩阵) + AdamW (Embedding/norm/bias/postnet) 混合优化器
# 默认值参考 K2 但按语音任务调保守:语音数据量较小、且常加载预训练 ckpt,
# 不能用 K2 长训 LLM 那套激进 lr / wd。lr 起点 1e-3 (≈ AdamW lr 的 10x);
# wd 起点 0.01 与 swan 现有 AdamW 一致,避免压缩预训练权重过头。
optimizer_type: adamw
optimizer:
  betas:
  - 0.9
  - 0.999
  fused: false
  lr: 1.0e-4
  weight_decay: 0.01
muon:
  lr: 1.0e-3
  momentum: 0.95
  weight_decay: 0.01
  ns_steps: 5
scheduler_lr_min: 5.0e-5
ckpt_milestone_interval: 50000
tb_log_interval: 1
grad_norm_skip_warmup_steps: 10000
grad_norm_skip_threshold: 10
grad_norm_skip_warmup_log_enabled: False
