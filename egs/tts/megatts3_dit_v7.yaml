base_config:
  - ./config_base.yaml
  - egs/tts/datasets/tts_dataset_v2_251125.yaml

task_cls: tasks.tts.megatts3_dit_v2.MegaTTSDiTV7Task

# dataset
train_sets:
dataset_cls: tasks.tts.dataset_utils.tts_fastdataset_v2.BaseTTSShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork

# dataloader
prefetch_steps: 16
eval_max_batches: 0
ds_workers: 12
max_tokens: 10000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_min: 100
tgt_size_max: 6000
frames_multiple: 8

# data
add_vad_mask: False
valid_ph_dur: False
use_ph_timestamp: False
use_merged_ph: False
use_cosyvoice2_text_tokenizer: True

# model
dit_version: v7
model_size: large
vae_ckpt: checkpoints/1231_megatts3_wavvae_v3_25hz_kl001_fix4
latent_dim: 32
vae_stride: 4
use_ema: True
ema_decay: 0.9995
use_caption_encoder: False
caption_encoder_name: Qwen/Qwen3-0.6B
caption_encoder_dim: 1024
caption_crossattn_n_layers: 0
use_qk_norm: False
is_foundation: False
is_partial_foundation: -1.0
reset_ling_modules: False

# cfg
lat_cfg_prob: 0.15
txt_cfg_prob: 0.3
caption_cfg_prob: 0.15
ph_cfg_prob: 0.15

# optimizer
scheduler_lr_min: 4.0e-5
disable_weight_decay_on_bias_and_norm_and_embed: False

load_ckpt: ''
use_fsdp: true
gradient_checkpointing: false
ckpt_milestone_interval: 50000
tb_log_interval: 1

