base_config:
  - egs/tts/config_base.yaml
  # - egs/tts/datasets/tts_dataset_v2_251125.yaml
  - egs/tts/datasets/tts_dataset_v2_251211.yaml

task_cls: tasks.tts.ditar_task.DiTARV2Task

# dataset
train_sets:
# dataset_cls: tasks.tts.dataset_utils.tts_fastdataset_v2.BaseTTSShmDataset
dataset_cls: tasks.tts.dataset_utils.tts_fastdataset_v2.TTSTextOnlyShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork
prefetch_steps: 12

# dataloader
eval_max_batches: 0
ds_workers: 8
max_tokens: 12000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_min: 50
tgt_size_max: 4000
frames_multiple: 8
use_cosyvoice2_text_tokenizer: True
mix_text_pinyin:
  enable: true
  enable_prob: 0.5

# model
model_size: 1b
vae_ckpt: checkpoints/251120_wavvae_v4_unfreeze
latent_dim: 32
vae_stride: 4
use_caption_encoder: False
caption_encoder_name: Qwen/Qwen3-0.6B
caption_encoder_dim: 1024
ditar_decoder_use_caption: False
use_qk_norm: True
ditar_patch_size: 4
ditar_ctx_n_patches: 2
training_patch_keep_ratio: 1.0
do_warmup_lm: False
use_ema: True
ema_decay: 0.9995
instruction_finetuning: False

stop_loss_start_step: 10
lambda_stop_loss: 1.0

# optimizer
scheduler_lr_min: 4.0e-5

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false
disable_weight_decay_on_bias_and_norm_and_embed: True
ckpt_milestone_interval: 50000
tb_log_interval: 1

grad_norm_skip_threshold: 1000.0
grad_norm_skip_warmup_steps: 10
