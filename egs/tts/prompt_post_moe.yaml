base_config:
- egs/tts/config_base.yaml
- egs/tts/datasets/promptaudio_dataset_va.yaml
# - egs/tts/datasets/tts_dataset_v2_251113.yaml

# task
# task_cls: tasks.tts.avgen_dump.PromptAudioTask
task_cls: tasks.tts.prompt_task.PromptDiTTask
dataset_cls: tasks.tts.dataset_utils.promptaudio_fastdataset_v2.PromptAudioShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork
use_audio_dataset: False

# data
frames_multiple: 8
filter_relevant: True

# dataloader
eval_max_batches: 0
ds_workers: 8
max_tokens: 12000
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 100
tgt_size_max: 6000  # 60 sec
tgt_size_min: 100   # 4 sec

# model
model_size: base
latent_dim: 32
vae_stride: 4
vae_ckpt: checkpoints/251120_wavvae_v4_unfreeze 
audio_tokenizer: glm4v
load_sd_text_encoder: True

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5
drop_st: True # drop semantic token
drop_xt: False # drop x_txt
dit_version: 5 # 1:normal 2:crass_att 3:ph
drop_ref_wav: 0.7
add_vad_mask: False
drop_vad: True
use_qwen: True # flan t5 xxl不支持中文
trained_module: all

# pretrained_text_encoder_qwen: "pretrained_models/Qwen2.5-32B-Instruct"
pretrained_text_encoder_qwen: "Qwen/Qwen3-32B"
text_max_token_length: 800
caption_encoder_dim: 5120
use_caption_pool_in_adaln: False
use_caption: True

use_caption_text_mark: True
use_qk_norm: True
use_dynamic_cross_gate: True

use_cosyvoice2_text_tokenizer: True
mix_text_pinyin:
  enable: true
  enable_prob: 0.4

use_global: True
use_spk_mask: False
crossattn_n_layers: 32
use_gated_attention: False

# moe
use_moe_ffn: True
moe_p: 0.7
moe_num_routed: 4
moe_num_shared: 2
moe_num_null: 1
moe_expert_dropout: 0.1
moe_use_gumbel: False
# moe_gumbel_tau_start: 1.0
# moe_gumbel_tau_end: 0.7
# moe_gumbel_tau_anneal_steps: 100000
moe_aux_loss_weight: 0.01
moe_aux_anneal_steps: 100000
moe_use_bias_balance: True
moe_bias_update_rate: 0.02
moe_bias_momentum: 0.9
moe_bias_clamp: 3.0
moe_capacity_factor_min: 1.3
moe_capacity_factor_max: 2.5
moe_overflow_drop: True
moe_use_t_budget: True
moe_p_min: 0.70
moe_p_max: 0.90
moe_null_logit_bias_min: -2.0
moe_null_logit_bias_max: 0.2     # <- 低 budget 时更偏向 null（更少算）