base_config:
  - egs/tts/megatts3_dit_v6.yaml
  # - egs/tts/datasets/tts_dataset_v2_251125.yaml
  - egs/tts/datasets/tts_posttrain_dataset_v2_251201.yaml

task_cls: tasks.tts.megatts3_v6_nft_task.MegaTTSDiTPostTrainPhoneTask

# dataset
train_sets:
dataset_cls: tasks.tts.dataset_utils.posttrain_fastdataset_v2.PosttrainTTSRepeatShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork

# dataloader
prefetch_steps: 12
eval_max_batches: 0
ds_workers: 4
max_tokens: 10000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_min: 100
tgt_size_max: 3000
frames_multiple: 8

# data
add_vad_mask: False
valid_ph_dur: False
use_ph_timestamp: False
use_merged_ph: False

# model
dit_version: v6
model_size: large
vae_ckpt: checkpoints/1231_megatts3_wavvae_v3_25hz_kl001_fix4
latent_dim: 32
vae_stride: 4
use_ema: True
ema_decay: 0.995
use_caption_encoder: False
caption_encoder_name: Qwen/Qwen3-0.6B
caption_encoder_dim: 1024
caption_crossattn_n_layers: 0
use_qk_norm: False
is_foundation: False
is_partial_foundation: -1.0

# cfg
lat_cfg_prob: 0.15
txt_cfg_prob: 0.15
caption_cfg_prob: 0.15
ph_cfg_prob: 0.15

# optimizer
scheduler_lr_min: 4.0e-5
disable_weight_decay_on_bias_and_norm_and_embed: False

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: true
ckpt_milestone_interval: 50000
tb_log_interval: -1   # never log in trainer

sample:
  num_batches_per_epoch: 2
  num_generation_per_prompt: 4
  train_batch_size: 2   # num of unique samples per gpu
  num_steps: 40
  guidance_scale: [1.4, 3.0]

train:
  batch_size: 16
  gradient_accumulation_steps: 1
  num_inner_epochs: 1
  timestep_fraction: 1.0
  beta: 0.0001
  adv_clip_max: 1
  adv_mode: all
  pbar_log_interval: 4

decay_type: 2
nft_beta: 0.1
per_prompt_stat_tracking: True
dataloader_num_replica: 8   # multi gpu share data
  
amp: false
val_check_interval: 100
ckpt_milestone_interval: 2000

optimizer:
  betas:
  - 0.9
  - 0.999
  fused: false
  lr: 1.0e-5
  weight_decay: 1.0e-4
