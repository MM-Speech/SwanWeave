base_config:
- egs/tts/config_base.yaml
# - egs/tts/datasets/promptaudio_dataset_v2.yaml
# - egs/tts/datasets/swan_caption_align_dataset.yaml
# - egs/tts/datasets/swan_caption_old_dataset.yaml
# - egs/tts/datasets/swan_caption_1spk_dataset.yaml
# - egs/tts/datasets/swan_caption_ads_dataset.yaml
- egs/tts/datasets/swan_caption_multi_dataset.yaml

# task
# task_cls: tasks.tts.avgen_dump.PromptAudioTask
task_cls: tasks.tts.prompt_task.PromptDiTTask
# dataset_cls: tasks.tts.dataset_utils.promptaudio_fastdataset_v2.PromptAudioShmDataset
# val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
# dataloader_mp_type: fork
# use_audio_dataset: False
frames_multiple: 4
dataset_cls: tasks.tts.dataset_utils.swan_caption_fastdataset.SwanCaptionShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork
use_audio_dataset: False

# dataloader
eval_max_batches: 0
ds_workers: 8
max_tokens: 12000
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 150
tgt_size_max: 6000  # 60 sec
tgt_size_min: 150   # 1.5 sec

# model
model_size: base
latent_dim: 32
vae_stride: 4
vae_ckpt: checkpoints/251120_wavvae_v4_unfreeze 
audio_tokenizer: glm4v
load_sd_text_encoder: True

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5
drop_st: True # drop semantic token
drop_xt: False # drop x_txt
dit_version: 5 # 1:normal 2:crass_att 3:ph
drop_ref_wav: 0.7
add_vad_mask: False
drop_vad: True
use_qwen: True # flan t5 xxl不支持中文
trained_module: all

# pretrained_text_encoder_qwen: "pretrained_models/Qwen2.5-32B-Instruct"
pretrained_text_encoder_qwen: "Qwen/Qwen3-32B"
text_max_token_length: 800
caption_encoder_dim: 5120
use_caption_pool_in_adaln: False
use_caption: True

use_caption_text_mark: True
use_qk_norm: True
use_dynamic_cross_gate: True
use_quality_caption: False
use_quality_flag: False
quality_flag_dropout: 0.15

use_cosyvoice2_text_tokenizer: True
mix_text_pinyin:
  enable: True
  enable_prob: 0.4

use_global: True
use_spk_mask: True
crossattn_n_layers: 32
use_gated_attention: False

# engram
use_engram: False
engram_target: caption
engram_orders: [1, 2]
engram_num_heads: 4
engram_table_size: 262144   # 2^18
engram_head_dim: 64
engram_gate_bias: -4.0
engram_conv_kernel: 3
engram_dropout: 0.0
engram_special_replace_id: 1

skipped_items_jsonl:
  enable: true
  path: swanlog/skipped_items.jsonl

max_speakers_in_caption: 4
