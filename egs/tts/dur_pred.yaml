base_config:
  - ./config_base.yaml
  - egs/tts/datasets/tts_dataset_v2_251125.yaml
  # - egs/tts/datasets/megatts_dataset_v2.yaml

task_cls: tasks.tts.megatts3_dit_v2.DurationPredictorTask

# dataset
dataset_cls: tasks.tts.dataset_utils.tts_fastdataset_v2.BaseTTSShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
dataloader_mp_type: fork

# dataloader
eval_max_batches: 0
prefetch_steps: 24
ds_workers: 4
max_tokens: 10000   # 24000 * 0.04 = 960 sec
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 300
tgt_size_min: 50
tgt_size_max: 12000
frames_multiple: 8

# data
add_vad_mask: False
valid_ph_dur: True
use_dur: True
vae_stride: 4
use_cosyvoice2_text_tokenizer: False
mix_text_pinyin:
  enable: true
  enable_prob: 0.4

# optimizer
scheduler_lr_min: 4.0e-5

load_ckpt: ''
use_fsdp: false
gradient_checkpointing: false
