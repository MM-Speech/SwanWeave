base_config:
- egs/tts/spat_audio_edit.yaml
- egs/tts/datasets/spat_edit_dpo_dataset.yaml

task_cls: tasks.tts.spat_audio_edit_dpo_task.SpatAudioEditDpoTask
dataset_cls: tasks.tts.spat_audio_edit_dpo_task.SpatAudioEditDpoShmDataset

# DPO trains the audio-edit policy against a frozen reference initialized from
# the same checkpoint. The normal positive diffusion loss is kept as an anchor.
train_base: false
load_wav: false
use_precomputed_latents: true
parallel_foa_vae_encode: true

# dataloader
eval_max_batches: 0
ds_workers: 12
max_tokens: 6000
max_sentences: 100
max_frames: 12000   # 5min
min_frames: 100
tgt_size_max: 6000
tgt_size_min: 100
fast_ds_prefetch_steps: 2

dpo_beta: 50.0
dpo_beta_warmup_steps: 2000
dpo_loss_weight: 1.0
dpo_diff_loss_weight: 1.0
dpo_share_noise: true

# Default to the current spatial-edit MoE settings for DPO.
use_moe_ffn: true
moe_use_ec: false
moe_p: 0.7
moe_num_routed: 4
moe_num_shared: 0
moe_num_task_experts: 4
moe_task_p: 0.7
moe_num_null: 1
moe_expert_dropout: 0.05
moe_use_gumbel: false
moe_use_bias_balance: false
moe_bias_update_rate: 1.0e-3
moe_bias_momentum: 0.9
moe_bias_clamp: 3.0
moe_aux_loss_weight: 1.0
moe_aux_anneal_steps: 200000
moe_load_balance_loss_coef: 1.0e-2
moe_router_z_loss_coef: 1.0e-3
moe_null_loss_coef: 1.0e-2
moe_capacity_factor_min: 1.3
moe_capacity_factor_max: 2.5
moe_overflow_drop: true
moe_use_t_budget: true
moe_p_min: 0.55
moe_p_max: 0.90
moe_null_logit_bias_min: -2.5
moe_null_logit_bias_max: -0.2
decoder_sparse_step: 1
mlp_only_layers: []
moe_intermediate_size: null
output_router_logits: true

use_ema: false
load_ckpt: checkpoints/260519_edit_latent_from_base_2
