base_config:
  - egs/tts/config_base.yaml
  - egs/tts/datasets/dialogue_dataset_v2_260302.yaml

# task
task_cls: tasks.tts.prompt_task.PromptDiTTask

# data
frames_multiple: 8
dataset_cls: tasks.tts.dataset_utils.dialogue_fastdataset_v2.DialogueShmDataset
val_dataset_cls: tasks.tts.dataset_utils.tts_datasets.DiTWavTextDataset
use_audio_dataset: False

# dataloader
fast_ds_shuffle_buffer: 2
eval_max_batches: 0
ds_workers: 8
max_tokens: 12000
max_sentences: 200
max_frames: 30000   # 5min
min_frames: 100
tgt_size_max: 12000  # 60 sec
tgt_size_min: 400   # 4 sec

online_text_alignment_dataloader: False
online_text_alignment_batch_size: 24
online_text_alignment_work_dir: user/service_cache/asr
online_text_alignment_task: False

# model
model_size: goku_2_large
latent_dim: 32
vae_stride: 4
vae_ckpt: checkpoints/251120_wavvae_v4_unfreeze 
use_ema: True
ema_decay: 0.999

load_ckpt: ''
use_fsdp: true
gradient_checkpointing: false

# training
scheduler_lr_min: 4.0e-5
drop_st: True
drop_xt: False # drop x_txt
dit_version: 5 # 1:normal 2:crass_att 3:ph
drop_ref_wav: 0.0
add_vad_mask: False
caption_encoder_dim: 5120

use_caption: False
use_caption_text_mark: False
use_qk_norm: True
use_dynamic_cross_gate: True

use_cosyvoice2_text_tokenizer: True
mix_text_pinyin:
  enable: true
  enable_prob: 0.5
use_spk_mask: True
crossattn_n_layers: 32
use_gated_attention: False
shuffle_spk_ids: False

wav_add_noise: False
wav_add_effect: False
musan_dir: /mnt/bn/sa-ag-data/liruiqi/data/speech/musan
musan_with_speech: False
wav_add_noise_prob: 0.1
wav_add_effect_prob: 0.1

val_check_interval: 2000
